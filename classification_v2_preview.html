<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分类预览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;background:#0b1020;color:#d7dee9;min-height:100vh}
a{color:inherit}
.shell{max-width:1460px;margin:0 auto;padding:18px 22px 42px}
.top{position:sticky;top:0;z-index:10;background:rgba(11,16,32,.94);backdrop-filter:blur(10px);border-bottom:1px solid #233047;padding:14px 0 16px;margin-bottom:18px}
.top-inner{max-width:1460px;margin:0 auto;padding:0 22px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.brand h1{font-size:19px;color:#8cc2ff;line-height:1.2}
.brand p{font-size:12px;color:#7f8ea3;margin-top:3px}
.search input{width:100%;height:38px;background:#11182b;border:1px solid #2b3955;color:#d7dee9;border-radius:8px;padding:0 12px;outline:none}
.search input:focus{border-color:#67b7dc}
.actions{display:flex;gap:8px;align-items:center}
.btn{height:34px;border:1px solid #2b3955;background:#151e33;color:#9fb2ca;border-radius:8px;padding:0 12px;cursor:pointer;text-decoration:none;font-size:13px;display:inline-flex;align-items:center}
.btn:hover{background:#1c2943;color:#fff}
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.nav{position:sticky;top:92px;background:#10182a;border:1px solid #24324b;border-radius:8px;padding:12px;max-height:calc(100vh - 112px);overflow:auto}
.nav-title{font-size:12px;color:#7f8ea3;margin:0 0 10px}
.nav button{width:100%;text-align:left;background:transparent;border:0;color:#bcc8d8;border-radius:6px;padding:8px 9px;cursor:pointer;font-size:13px;line-height:1.3}
.nav button:hover{background:#18233a;color:#fff}
.nav button.active{background:#26435f;color:#dff3ff}
.nav .child{padding-left:20px;font-size:12px;color:#93a4ba}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{background:#10182a;border:1px solid #24324b;border-radius:8px;padding:12px}
.metric b{display:block;font-size:12px;color:#7f8ea3;font-weight:500;margin-bottom:4px}
.metric span{font-size:22px;font-weight:800;color:#f4f7fb}
.panel{background:#10182a;border:1px solid #24324b;border-radius:8px;padding:16px;margin-bottom:14px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.panel h2{font-size:22px;color:#f4f7fb;line-height:1.2}
.path{font-size:12px;color:#7f8ea3;margin-top:5px}
.pill-row{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid #2b3955;background:#151e33;color:#9fb2ca;border-radius:999px;padding:4px 9px;font-size:12px}
.pill.good{border-color:#2f6f59;background:#113426;color:#72d6a0}
.pill.warn{border-color:#785b23;background:#38270d;color:#e7c56b}
.node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.node-card,.stock-card{background:#11182b;border:1px solid #24324b;border-radius:8px;padding:13px;cursor:pointer}
.node-card:hover,.stock-card:hover{border-color:#67b7dc;background:#142039}
.node-card h3,.stock-card h3{font-size:15px;color:#f4f7fb;margin-bottom:7px}
.node-card.suggest{border-color:#394b6b;background:#101a2f;cursor:default}
.node-card.suggest h3{color:#ffd479}
.muted{font-size:12px;color:#7f8ea3;line-height:1.6}
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.stock-card{cursor:default}
.stock-card.strong{border-left:4px solid #e15241;background:linear-gradient(90deg,#31161a 0,#11182b 24%)}
.stock-card.steady{border-left:4px solid #d6a12e;background:linear-gradient(90deg,#2e250e 0,#11182b 24%)}
.stock-card.watch{border-left:4px solid #5fa8ff;background:linear-gradient(90deg,#102842 0,#11182b 24%)}
.stock-card.risk{border-left:4px solid #7f8ea3;background:linear-gradient(90deg,#182033 0,#11182b 24%)}
.pill.strong{border-color:#e15241;color:#ffb1a8;background:#401c20}.pill.steady{border-color:#d6a12e;color:#f0d17a;background:#38270d}.pill.watch{border-color:#5fa8ff;color:#9bcbff;background:#102842}.pill.risk{border-color:#7f8ea3;color:#d7dee9;background:#182033}
.stock-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.code{font-size:12px;color:#7f8ea3}
.weight{font-size:12px;color:#72d6a0;background:#113426;border:1px solid #2f6f59;border-radius:999px;padding:2px 8px;white-space:nowrap}
.rows{margin-top:10px;border-top:1px solid #24324b}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #1b2840;padding:6px 0;font-size:12px}
.row span:first-child{color:#7f8ea3}
.row span:last-child{color:#d7dee9;text-align:right}
.report-link{display:inline-flex;margin-top:10px;height:30px;align-items:center;padding:0 10px;border-radius:7px;background:#1d6f42;color:#fff;text-decoration:none;font-size:12px}
.report-link:hover{background:#278a55}
.empty{padding:26px;text-align:center;color:#7f8ea3}
.hidden{display:none!important}
@media(max-width:900px){.top-inner{grid-template-columns:1fr}.actions{justify-content:flex-start}.layout{grid-template-columns:1fr}.nav{position:static;max-height:none}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

</head>
<body>
<div class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>分类预览</h1>
      <p>概念图驱动的新首页树</p>
    </div>
    <div class="search"><input id="search" placeholder="搜索公司、代码、概念节点、标签"></div>
    <div class="actions">
      <a class="btn" href="index.html">返回首页</a>
      <a class="btn" href="index_classification_v2.html">新版首页</a>
      <button class="btn" id="showAll">全部节点</button>
    </div>
  </div>
</div>

<main class="shell">
  <section class="summary" id="summary"></section>
  <section class="layout">
    <nav class="nav">
      <div class="nav-title">概念图节点</div>
      <div id="nav"></div>
    </nav>
    <div id="main"></div>
  </section>
</main>

<script src="classification_v2.js"></script>
<script src="classification_rules_v2.js"></script>
<script src="v2_reports_index.js"></script>
<script src="p0_evidence_cards_v1.js"></script>
<script>
var DATA = typeof CLASSIFICATION_V2_INDEX !== 'undefined' ? CLASSIFICATION_V2_INDEX : null;
var RULES = typeof CLASSIFICATION_RULES_V2 !== 'undefined' ? CLASSIFICATION_RULES_V2 : null;
var REPORTS = typeof V2_REPORTS_BY_CODE !== 'undefined' ? V2_REPORTS_BY_CODE : {};
var P0CARDS = typeof P0_EVIDENCE_CARDS_V1 !== 'undefined' ? P0_EVIDENCE_CARDS_V1 : {rows:[]};
var P0_BY_CODE = {};
(P0CARDS.rows||[]).forEach(function(r){P0_BY_CODE[r.code]=r});
var activeNode = null;
var query = '';

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtNum(v,suffix){return typeof v==='number'?v.toFixed(2).replace(/\.?0+$/,'')+(suffix||''):'--'}
function fmtPct(v){return typeof v==='number'?(v>0?'+':'')+v.toFixed(2).replace(/\.?0+$/,'')+'%':'--'}
function reportHref(stock){var r=REPORTS[stock.code];return r&&r.file?encodeURI(r.relative_path||('reports_v2/'+r.file)):''}
function evidenceCard(code){return P0_BY_CODE[String(code).padStart(6,'0')]||P0_BY_CODE[code]||null}
function evidenceScores(stock){var ev=evidenceCard(stock.code),ce=ev&&ev.classification_evidence||{};return{theme:typeof ce.theme_purity_score==='number'?ce.theme_purity_score:null,fundamental:typeof ce.fundamental_score==='number'?ce.fundamental_score:null,original:ev&&ev.original_evidence_level||''}}
function evidenceGrade(stock){var e=evidenceScores(stock),t=e.theme,f=e.fundamental;if(t===null)return{label:'未接证据',cls:'watch'};if(t>=90&&f!==null&&f>=75)return{label:'高纯度核心',cls:'strong'};if(t>=88)return{label:'高纯度观察',cls:'steady'};if(t>=78)return{label:'证据跟踪',cls:'watch'};return{label:'证据偏弱',cls:'risk'}}
function nodes(){return (DATA&&DATA.taxonomy&&DATA.taxonomy.nodes)||[]}
function roots(){return nodes().filter(function(n){return !n.parent})}
function childrenOf(id){return nodes().filter(function(n){return n.parent===id})}
function conceptByNode(id){return ((DATA&&DATA.concepts)||[]).find(function(c){return c.node_id===id})||null}
function stocks(){return DATA?Object.keys(DATA.stocks_by_code||{}).map(function(k){return DATA.stocks_by_code[k]}):[]}
function stockNodeHit(stock,nodeId){
 var best=null;
 (stock.tags||[]).forEach(function(t){
  if(t.node_id!==nodeId)return;
  if(!best||t.weight>best.weight)best=t;
 });
 return best;
}
function stockMatchesQuery(stock){
 if(!query)return true;
 var text=[stock.code,stock.name,stock.primary_industry].concat(stock.secondary_tracks||[]).concat((stock.tags||[]).map(function(t){return t.name+' '+t.node_name})).join(' ').toLowerCase();
 return text.indexOf(query.toLowerCase())>=0;
}
function stocksForNode(id){
 return stocks().map(function(s){return {stock:s,hit:stockNodeHit(s,id)}}).filter(function(x){return x.hit&&stockMatchesQuery(x.stock)}).sort(function(a,b){return b.hit.weight-a.hit.weight});
}
function suggestedChildren(id){
 var map={
  renewable_power:[
   ['火电 / 煤电', '燃煤发电、热电联产、供热、调峰电源'],
   ['水电', '水力发电、抽水蓄能、流域电站'],
   ['核电', '核电运营、核岛、常规岛、核能设备'],
   ['光伏', '光伏组件、逆变器、硅料硅片、电池片、光伏设备、光热发电'],
   ['风电', '整机、叶片、塔筒、海风、轴承与电缆'],
   ['储能并网', 'PCS、储能系统、变流器、微电网、虚拟电厂'],
   ['绿电运营', '电站运营、公用事业、售电'],
   ['电网设备 / 特高压', '电网设备、特高压、智能电网、输变电、配电网'],
   ['综合能源服务', '综合能源、电力运营、源网荷储、节能服务']
  ],
  consumer_electronics:[
   ['AI终端 / 消费电子', '手机链、AI手机、智能硬件、声学、结构件'],
   ['面板 / 显示', 'LCD、OLED、Mini LED、显示材料与模组'],
   ['智能家居 / 白电', '白电、智能家居、家电零部件'],
   ['苹果链 / 终端制造', '整机代工、精密制造、终端零部件']
  ],
  communications:[
   ['光通信基础设施', '光纤光缆、光棒预制棒、海底光缆、电力通信'],
   ['运营商 / IDC', '运营商、IDC、数据中心网络'],
   ['通信设备', '交换机、路由器、传输设备、无线设备']
  ],
  robotics:[
   ['人形机器人', '本体、整机、系统集成'],
   ['执行器', '关节模组、空心杯电机、控制器'],
   ['减速器 / 丝杠', '谐波减速器、RV减速器、滚柱丝杠'],
   ['传感器 / 电子皮肤', '力矩、触觉、视觉、电子皮肤'],
   ['工业自动化', '工业母机、数控、工业软件']
  ],
  industrial_equipment:[
   ['工程机械 / 矿山装备', '矿山机械、工程设备、冶金工程'],
   ['工业软件 / 企业软件', '工业软件、办公软件、企业服务'],
   ['精密制造 / 高端设备', '精密制造、自动化设备、高端装备']
  ],
  advanced_materials:[
   ['高端金属 / 合金', '钛合金、高温合金、铜合金、特种钢'],
   ['电子材料', '高纯铝、电子铝箔、电极箔、磁性材料'],
   ['新能源材料', '锂资源、稀土磁材、光伏材料']
  ],
  chemical_materials:[
   ['新材料化工', '聚氨酯、MDI、精细化工、电子化学品'],
   ['石化 / 煤化工', '炼化、烯烃、煤化工'],
   ['化纤 / 高分子', '化纤、工程塑料、功能材料']
  ],
  resources:[
   ['能源资源', '煤炭、油气、炼化'],
   ['金属矿产', '铜、金、锂、钴、战略金属'],
   ['黄金 / 贵金属', '黄金、白银、贵金属']
  ],
  defense_aerospace:[
   ['航空装备 / 大飞机', '大飞机、航空装备、机体结构'],
   ['航空发动机', '发动机、叶片、高温合金'],
   ['军工主机', '整机、主机厂、军工电子'],
   ['商业航天 / 卫星互联网', '卫星、火箭、地面站、运营服务']
  ],
  finance:[
   ['银行', '股份行、城商行、国有行'],
   ['证券 / 财富管理', '券商、互联网券商、财富管理'],
   ['保险 / 综合金融', '保险、综合金融、金融科技'],
   ['高股息金融', '高股息、低估值、稳定分红']
  ],
  consumer_bluechip:[
   ['白酒 / 高端消费', '白酒、高端消费、品牌消费'],
   ['大众消费', '食品饮料、渠道、消费服务'],
   ['高股息消费', '稳定分红、防御消费']
  ]
 };
 return map[id]||[];
}
function relatedStocksForRoot(id){
 var ids=[id].concat(childrenOf(id).map(function(n){return n.id}));
 var map={};
 ids.forEach(function(nodeId){
  stocksForNode(nodeId).forEach(function(x){
   var old=map[x.stock.code];
   if(!old||x.hit.weight>old.hit.weight)map[x.stock.code]=x;
  });
 });
 return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.hit.weight-a.hit.weight});
}
function renderSummary(){
 var unmapped=(DATA&&DATA.unmapped_concepts)||[];
 var high=(P0CARDS.rows||[]).filter(function(r){return (r.classification_evidence||{}).theme_purity_score>=88}).length;
 document.getElementById('summary').innerHTML=[
  ['已校准公司',DATA?DATA.calibrated_count:0],
  ['概念图节点',nodes().length],
  ['P0高纯度',high],
  ['待归类概念',unmapped.length]
 ].map(function(m){return '<div class="metric"><b>'+esc(m[0])+'</b><span>'+esc(m[1])+'</span></div>'}).join('');
}
function renderNav(){
 var html='';
 roots().forEach(function(r){
  html+='<button class="'+(activeNode===r.id?'active':'')+'" onclick="selectNode(\''+esc(r.id)+'\')">'+esc(r.name)+' <span class="muted">('+esc(r.stock_count||0)+')</span></button>';
  childrenOf(r.id).forEach(function(c){
   html+='<button class="child '+(activeNode===c.id?'active':'')+'" onclick="selectNode(\''+esc(c.id)+'\')">'+esc(c.name)+' <span class="muted">('+esc(c.stock_count||0)+')</span></button>';
  });
 });
 document.getElementById('nav').innerHTML=html;
}
function metricPills(node,concept){
 var raw=(concept&&concept.raw_tags||node.raw_tags||[]).slice(0,8).map(function(t){return '<span class="pill">'+esc(t)+'</span>'}).join('');
 return '<div class="pill-row"><span class="pill good">命中 '+esc(node.stock_count||0)+' 家</span><span class="pill">总权重 '+fmtNum(node.total_weight||0,'')+'</span>'+raw+'</div>';
}
function stockCard(x){
 var s=x.stock,h=x.hit,fs=s.financial_signal||{},href=reportHref(s),ev=evidenceCard(s.code),eg=evidenceGrade(s),es=evidenceScores(s);
 return '<article class="stock-card '+eg.cls+'"><div class="stock-top"><div><h3>'+esc(s.name)+'</h3><div class="code">'+esc(s.code)+' · '+esc(s.primary_industry)+'</div></div><div class="weight">W '+fmtNum(h.weight,'')+'</div></div><div class="pill-row"><span class="pill '+eg.cls+'">'+esc(eg.label)+'</span>'+(ev?'<span class="pill">主题 '+fmtNum(es.theme,'')+'</span><span class="pill">基本面 '+fmtNum(es.fundamental,'')+'</span>':'')+'</div>'
  +'<div class="rows"><div class="row"><span>命中标签</span><span>'+esc(h.name)+' → '+esc(h.node_name)+'</span></div>'
  +(ev?'<div class="row"><span>主题 / 基本面</span><span>'+fmtNum(es.theme,'')+' / '+fmtNum(es.fundamental,'')+'</span></div>':'')
  +'<div class="row"><span>净利润</span><span>'+fmtNum(fs.net_profit_yi,'亿元')+'</span></div>'
  +'<div class="row"><span>同比 / 状态</span><span>'+fmtPct(fs.yoy_parent_net_income_pct)+' / '+esc(fs.improvement_status||'--')+'</span></div></div>'
  +(href?'<a class="report-link" target="_blank" rel="noopener noreferrer" href="'+href+'">打开深度报告</a>':'')
  +'</article>';
}
function renderRulesPanel(){
 if(!RULES)return '';
 var roots=(RULES.taxonomy||[]), childCount=roots.reduce(function(sum,r){return sum+(r.children||[]).length},0);
 var aliases=(RULES.concept_alias_groups||[]).length, hot=(RULES.hot_candidate_pool||[]).length;
 var missing=roots.filter(function(r){return !nodes().some(function(n){return n.id===r.id})}).slice(0,10);
 var policy=(RULES.evidence_policy&&RULES.evidence_policy.leaf_assignment||[]).slice(0,4).map(function(x){return '<span class="pill">'+esc(x.id)+'</span>'}).join('');
 var html='<section class="panel"><div class="panel-head"><div><h2>全A分类规则底座</h2><div class="path">规则版本 '+esc(RULES.version||'--')+' · 主行业 + 多概念标签 + 动态权重</div></div><span class="pill good">已接入</span></div>';
 html+='<div class="summary" style="margin-top:10px"><div class="metric"><b>'+roots.length+'</b><span>规则主分类</span></div><div class="metric"><b>'+childCount+'</b><span>规则子分类</span></div><div class="metric"><b>'+aliases+'</b><span>别名组</span></div><div class="metric"><b>'+hot+'</b><span>候选热点</span></div></div>';
 html+='<div class="pill-row">'+policy+'</div>';
 if(missing.length){
  html+='<div class="muted" style="margin-top:10px">待后续样本启用：'+missing.map(function(r){return esc(r.name)}).join(' / ')+'</div>';
 }else{
  html+='<div class="muted" style="margin-top:10px">当前正式样本分类已覆盖规则主分类。</div>';
 }
 return html+'</section>';
}
function renderNode(id){
 var node=nodes().find(function(n){return n.id===id});
 if(!node){renderHome();return}
 var concept=conceptByNode(id);
 var childNodes=childrenOf(id);
 var list=childNodes.length?relatedStocksForRoot(id):stocksForNode(id);
 var html='<section class="panel"><div class="panel-head"><div><h2>'+esc(node.name)+'</h2><div class="path">'+esc((node.path||[node.name]).join(' / '))+'</div></div></div>'+metricPills(node,concept)+'</section>';
 if(childNodes.length){
  html+='<section class="panel"><div class="panel-head"><h2>子概念节点</h2></div><div class="node-grid">';
  childNodes.forEach(function(c){
   html+='<div class="node-card" onclick="selectNode(\''+esc(c.id)+'\')"><h3>'+esc(c.name)+'</h3><div class="muted">命中 '+esc(c.stock_count||0)+' 家 · '+esc((c.raw_tags||[]).slice(0,5).join(' / ')||'暂无标签')+'</div></div>';
  });
  html+='</div></section>';
 }else{
  var suggested=suggestedChildren(id);
  if(suggested.length){
   html+='<section class="panel"><div class="panel-head"><div><h2>建议补充分层</h2><div class="path">当前底层 taxonomy 还没有子节点，先按产业链逻辑给出拆分草案</div></div></div><div class="node-grid">';
   suggested.forEach(function(c){
    html+='<div class="node-card suggest"><h3>'+esc(c[0])+'</h3><div class="muted">'+esc(c[1])+'</div></div>';
   });
   html+='</div></section>';
  }
 }
 html+='<section class="panel"><div class="panel-head"><div><h2>挂载公司</h2><div class="path">'+esc(query?'已按搜索过滤':'按标签权重排序')+'</div></div><span class="pill">'+list.length+' 家</span></div>';
 html+=list.length?'<div class="stock-grid">'+list.map(stockCard).join('')+'</div>':'<div class="empty">没有匹配公司</div>';
 html+='</section>';
 document.getElementById('main').innerHTML=html;
}
function renderHome(){
 var html='<section class="panel"><div class="panel-head"><div><h2>概念图主干</h2><div class="path">先看结构，再决定是否替换首页旧赛道</div></div></div><div class="node-grid">';
 roots().forEach(function(r){
  html+='<div class="node-card" onclick="selectNode(\''+esc(r.id)+'\')"><h3>'+esc(r.name)+'</h3><div class="muted">命中 '+esc(r.stock_count||0)+' 家 · 子节点 '+childrenOf(r.id).length+' 个</div></div>';
 });
 html+='</div></section>';
 html+=renderRulesPanel();
 var noChildren=roots().filter(function(r){return childrenOf(r.id).length===0&&suggestedChildren(r.id).length});
 if(noChildren.length){
  html+='<section class="panel"><div class="panel-head"><div><h2>待补子分类行业</h2><div class="path">这些一级行业当前没有正式子节点，建议下一步固化到分类 V2 生成器</div></div><span class="pill warn">'+noChildren.length+' 个</span></div><div class="node-grid">';
  noChildren.forEach(function(r){
   html+='<div class="node-card suggest" onclick="selectNode(\''+esc(r.id)+'\')"><h3>'+esc(r.name)+'</h3><div class="muted">建议拆分：'+suggestedChildren(r.id).map(function(x){return x[0]}).join(' / ')+'</div></div>';
  });
  html+='</div></section>';
 }
 if(query){
  var list=stocks().filter(stockMatchesQuery).map(function(s){var best=(s.tags||[]).filter(function(t){return t.node_id!=='unmapped'}).sort(function(a,b){return b.weight-a.weight})[0];return best?{stock:s,hit:best}:null}).filter(Boolean);
  html+='<section class="panel"><div class="panel-head"><h2>搜索结果</h2><span class="pill">'+list.length+' 家</span></div><div class="stock-grid">'+list.map(stockCard).join('')+'</div></section>';
 }
 document.getElementById('main').innerHTML=html;
}
function selectNode(id){activeNode=id;renderNav();renderNode(id)}
function render(){renderSummary();renderNav();activeNode?renderNode(activeNode):renderHome()}

document.getElementById('search').addEventListener('input',function(e){query=e.target.value.trim();activeNode?renderNode(activeNode):renderHome()});
document.getElementById('showAll').addEventListener('click',function(){activeNode=null;query='';document.getElementById('search').value='';render()});
if(!DATA){document.getElementById('main').innerHTML='<div class="panel empty">分类数据未加载</div>'}else{render()}
</script>
</body>
</html>
