<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>批次A公告全文证据</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#11151b;color:#e8ebf0}a{color:#8fc4ff;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:#11151b;border-bottom:1px solid #2b3340}.top-inner{max-width:1540px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:21px}.meta{font-size:12px;color:#98a3b3;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #303a49;background:#18202a;color:#dfe5ee;border-radius:8px;padding:8px 10px;font-size:13px}.wrap{max-width:1540px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#18202a;border:1px solid #2b3340;border-radius:8px;padding:12px}.metric b{display:block;font-size:24px}.metric span{font-size:12px;color:#98a3b3}.panel{background:#18202a;border:1px solid #2b3340;border-radius:8px;padding:14px;margin-bottom:14px}.note{font-size:13px;line-height:1.75;color:#ccd3de}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:12px}.card{border:1px solid #2b3340;background:#10161d;border-radius:8px;padding:14px}.name{font-weight:800;font-size:16px;margin-bottom:8px}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{border:1px solid #354154;border-radius:999px;padding:3px 8px;font-size:12px;color:#dce2eb;background:#18202a}.pill.red{border-color:#d85b4a;color:#ffb5aa}.pill.yellow{border-color:#d7a83b;color:#f1d27d}.pill.blue{border-color:#6aa6ff;color:#acd0ff}.pill.green{border-color:#4da86b;color:#95e4aa}.item{border-top:1px solid #26303c;padding:10px 0}.item:first-of-type{border-top:0}.item-title{font-size:13px;font-weight:800;margin-bottom:6px}.text{font-size:13px;line-height:1.65;color:#dce2eb;white-space:pre-wrap}.muted{color:#98a3b3}.snippet{background:#0d1218;border:1px solid #25303c;border-radius:8px;padding:8px;margin-top:6px}
@media(max-width:1100px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.top-inner{align-items:flex-start;flex-direction:column}}
</style>
</head><body>
<header class="top"><div class="top-inner"><div><h1>批次A公告全文证据</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="batch_a_partner_candidate_workbench.html?v=candidate1">候选线索</a><a class="btn" href="legacy_p0_batch_a_workbench.html?v=batcha5">批次A工作台</a></div></div></header>
<main class="wrap"><div class="summary" id="summary"></div><section class="panel"><div class="note" id="note"></div></section><section id="content"></section></main>
<script src="batch_a_announcement_fulltext_evidence_v1.js"></script>
<script>
const DATA=typeof BATCH_A_ANNOUNCEMENT_FULLTEXT_EVIDENCE_V1!=="undefined"?BATCH_A_ANNOUNCEMENT_FULLTEXT_EVIDENCE_V1:{rows:[],summary:{}};
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pill(t,cls){return '<span class="pill '+(cls||'blue')+'">'+esc(t)+'</span>'}
function metric(label,value){return '<div class="metric"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function itemHtml(item){const strong=(item.confirmed_candidates||[]).length>0;const cls=strong?'green':(item.status==='解析失败'?'red':(item.status.includes('出现')?'yellow':'blue'));return '<div class="item"><div class="item-title">'+esc(item.title)+'</div><div class="pill-row">'+pill(item.status,cls)+pill('文本 '+(item.text_chars||0)+' 字','blue')+(item.confirmed_candidates||[]).map(x=>pill('强线索 '+x,'green')).join('')+'</div><div class="pill-row">'+(item.file_url?'<a class="btn" target="_blank" href="'+esc(item.file_url)+'">打开PDF</a>':'')+(item.url?'<a class="btn" target="_blank" href="'+esc(item.url)+'">公告页</a>':'')+'</div>'+(item.evidence||[]).map(e=>'<div class="snippet"><div class="pill-row">'+pill(e.partner,e.can_confirm?'green':'yellow')+pill(e.has_context?'有关系词':'无关系词',e.has_context?'green':'yellow')+pill(e.has_negative?'含否定/不披露':'无否定',e.has_negative?'red':'blue')+'</div><div class="text muted">'+esc(e.snippet)+'</div></div>').join('')+(item.error?'<div class="text muted">'+esc(item.error)+'</div>':'')+'</div>'}
function render(){const s=DATA.summary||{};document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--');document.getElementById('note').textContent=DATA.rule_note||'';document.getElementById('summary').innerHTML=[['公司数',s.companies],['公告数',s.announcements],['全文强线索',s.strong_fulltext_items],['解析失败',s.parse_errors]].map(x=>metric(x[0],x[1])).join('');document.getElementById('content').innerHTML='<div class="grid">'+DATA.rows.map(r=>'<article class="card"><div class="name">'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="pill-row">'+pill('公告 '+r.announcement_count,'blue')+pill('强线索 '+r.strong_fulltext_count,r.strong_fulltext_count?'green':'blue')+'</div>'+r.items.map(itemHtml).join('')+'</article>').join('')+'</div>'}
render();
</script></body></html>
