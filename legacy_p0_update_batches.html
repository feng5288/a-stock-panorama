<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旧报告P0更新执行批次</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#11151b;color:#e8ebf0}a{color:#91c2ff;text-decoration:none}.top{position:sticky;top:0;z-index:10;background:#11151b;border-bottom:1px solid #2b3340}.top-inner{max-width:1580px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:21px}.meta{font-size:12px;color:#98a3b3;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #303a49;background:#18202a;color:#dfe5ee;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.btn.active{border-color:#73a9ff;background:#10233d;color:#fff}.wrap{max-width:1580px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#18202a;border:1px solid #2b3340;border-radius:8px;padding:12px}.metric b{display:block;font-size:24px}.metric span{font-size:12px;color:#98a3b3}.panel{background:#18202a;border:1px solid #2b3340;border-radius:8px;padding:14px;margin-bottom:14px}.note{font-size:13px;line-height:1.75;color:#ccd3de}.batch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}.batch{border:1px solid #313b4b;border-radius:8px;background:#121820;padding:14px}.batch h2{font-size:16px;margin-bottom:8px}.batch p{font-size:13px;line-height:1.65;color:#cbd3df}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search{min-width:260px;flex:1}.search input{width:100%;background:#10161d;border:1px solid #303a49;border-radius:8px;color:#fff;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:12px}.card{border:1px solid #2b3340;background:#10161d;border-radius:8px;padding:14px}.card.a{border-left:5px solid #d85b4a}.card.b{border-left:5px solid #d7a83b}.card.c{border-left:5px solid #5f8fd9}.name{font-weight:800;font-size:16px;margin-bottom:7px}.rank{font-size:12px;color:#98a3b3;margin-right:4px}.path{font-size:13px;color:#d7dde7;margin:8px 0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.kpi{background:#0d1218;border:1px solid #25303c;border-radius:8px;padding:8px;min-height:60px}.kpi b{display:block;font-size:14px;color:#fff;overflow-wrap:anywhere}.kpi span{display:block;font-size:11px;color:#98a3b3;margin-top:4px}.section-title{font-size:12px;color:#98a3b3;margin-top:11px;margin-bottom:6px}.text{font-size:13px;line-height:1.65;color:#dce2eb}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #354154;border-radius:999px;padding:3px 8px;font-size:12px;color:#dce2eb;background:#18202a}.pill.hot{border-color:#d85b4a;color:#ffb5aa}.pill.warn{border-color:#d7a83b;color:#f1d27d}.pill.info{border-color:#6aa6ff;color:#acd0ff}.pill.ok{border-color:#4da86b;color:#95e4aa}.empty{padding:36px;text-align:center;color:#98a3b3}@media(max-width:1100px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.batch-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.top-inner{align-items:flex-start;flex-direction:column}}
</style>
</head><body>
<header class="top"><div class="top-inner"><div><h1>旧报告P0更新执行批次</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="legacy_p0_batch_a_workbench.html?v=batcha1">第一批工作台</a><a class="btn" href="legacy_p0_evidence_cards_preview.html?v=p0light2">P0证据卡</a><a class="btn" href="legacy_report_quality_queue.html?v=q1">质量队列</a><a class="btn" href="index_classification_v2_legacy1609_mapped.html?v=map4">旧报告映射版</a></div></div></header>
<main class="wrap"><div class="summary" id="summary"></div>
<section class="panel"><div class="note">这个页面把 P0 的 32 家旧报告公司拆成可执行批次。原则是：旧报告继续保留低权重入口，先修分类和证据，再按批次生成 V2 深度报告；没有最新财务字段和主营证据前，不用新页面替换正式报告。</div></section>
<section class="batch-grid" id="batchIntro"></section>
<section class="panel"><div class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="A">第一批</button><button class="btn" data-filter="B">第二批</button><button class="btn" data-filter="C">第三批</button><button class="btn" data-filter="override">公司纠偏</button><button class="btn" data-filter="conflict">旧标签冲突</button><div class="search"><input id="search" placeholder="搜索公司 / 代码 / 节点 / 动作"></div></div><div id="content"></div></section>
</main>
<script src="legacy_p0_update_batches_v1.js"></script>
<script>
var DATA=typeof LEGACY_P0_UPDATE_BATCHES_V1!=="undefined"?LEGACY_P0_UPDATE_BATCHES_V1:{rows:[],summary:{},batch_rules:{}};var rows=DATA.rows||[];var active='all';var q='';
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function has(r,t){return (r.issue_types||[]).indexOf(t)>=0}
function pill(text,cls){return '<span class="pill '+(cls||'info')+'">'+esc(text)+'</span>'}
function kpi(label,value){return '<div class="kpi"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function filtered(){var term=q.trim().toLowerCase();return rows.filter(function(r){if(['A','B','C'].indexOf(active)>=0&&r.batch!==active)return false;if(active==='override'&&!has(r,'company_override'))return false;if(active==='conflict'&&!has(r,'old_tag_conflict'))return false;if(!term)return true;return [r.name,r.code,r.mapped_node_name,r.old_path,r.batch_name,r.next_status,(r.required_fields||[]).join(' ')].join(' ').toLowerCase().indexOf(term)>=0})}
function renderSummary(){var s=DATA.summary||{};var items=[['总P0',s.total],['第一批',s.batch_a],['第二批',s.batch_b],['第三批',s.batch_c],['公司纠偏',s.company_override],['旧标签冲突',s.old_tag_conflict],['千亿以上',s.large_cap]];document.getElementById('summary').innerHTML=items.map(function(x){return '<div class="metric"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>'}).join('');document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · P0旧报告低权重更新执行表'}
function renderBatchIntro(){var rules=DATA.batch_rules||{};document.getElementById('batchIntro').innerHTML=['A','B','C'].map(function(k){var r=rules[k]||{};return '<article class="batch"><h2>'+esc(r.name)+'</h2><p>'+esc(r.principle)+'</p><p>'+esc(r.deliverable)+'</p></article>'}).join('')}
function card(r){return '<article class="card '+String(r.batch||'').toLowerCase()+'"><div class="name"><span class="rank">#'+esc(r.execution_order)+'</span>'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="pill-row">'+pill(r.batch_short,'hot')+pill('队列分 '+r.queue_score,'warn')+pill(r.confidence,'info')+'</div><div class="path">'+esc(r.old_path)+' → '+esc(r.mapped_node_name)+'</div><div class="kpis">'+kpi('市值',r.market_cap_yi?String(r.market_cap_yi)+'亿':'--')+kpi('旧评级',r.rating||'--')+kpi('当前状态',r.next_status)+kpi('映射原因',r.mapping_reason)+'</div><div class="section-title">必须补齐字段</div><div class="pill-row">'+(r.required_fields||[]).map(function(x){return pill(x,'info')}).join('')+'</div><div class="section-title">诊断理由</div><div class="text">'+(r.diagnosis_reasons||[]).map(esc).join('；')+'</div><div class="section-title">禁止动作</div><div class="text">'+esc(r.must_not_do)+'</div><div class="pill-row">'+(r.old_report_path?'<a class="btn" href="'+encodeURI(r.old_report_path)+'">打开旧报告</a>':'')+'</div></article>'}
function render(){renderSummary();renderBatchIntro();document.querySelectorAll('[data-filter]').forEach(function(b){b.classList.toggle('active',active===b.dataset.filter);b.onclick=function(){active=b.dataset.filter;render()}});var list=filtered();document.getElementById('content').innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">没有匹配项</div>'}
document.getElementById('search').addEventListener('input',function(e){q=e.target.value;render()});render();
</script></body></html>
