<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P0第二批分类纠偏工作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#11151b;color:#e8ebf0}a{color:#91c2ff;text-decoration:none}.top{position:sticky;top:0;z-index:10;background:#11151b;border-bottom:1px solid #2b3340}.top-inner{max-width:1580px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:21px}.meta{font-size:12px;color:#98a3b3;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #303a49;background:#18202a;color:#dfe5ee;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.btn.active{border-color:#73a9ff;background:#10233d;color:#fff}.wrap{max-width:1580px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#18202a;border:1px solid #2b3340;border-radius:8px;padding:12px}.metric b{display:block;font-size:24px}.metric span{font-size:12px;color:#98a3b3}.panel{background:#18202a;border:1px solid #2b3340;border-radius:8px;padding:14px;margin-bottom:14px}.note{font-size:13px;line-height:1.75;color:#ccd3de}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search{min-width:260px;flex:1}.search input{width:100%;background:#10161d;border:1px solid #303a49;border-radius:8px;color:#fff;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px}.card{border:1px solid #2b3340;background:#10161d;border-radius:8px;padding:14px;border-left:5px solid #6aa6ff}.name{font-weight:800;font-size:16px;margin-bottom:7px}.rank{font-size:12px;color:#98a3b3;margin-right:4px}.path{font-size:13px;color:#d7dde7;margin:8px 0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.kpi{background:#0d1218;border:1px solid #25303c;border-radius:8px;padding:8px;min-height:64px}.kpi b{display:block;font-size:14px;color:#fff;overflow-wrap:anywhere}.kpi span{display:block;font-size:11px;color:#98a3b3;margin-top:4px}.section-title{font-size:12px;color:#98a3b3;margin-top:11px;margin-bottom:6px}.text{font-size:13px;line-height:1.65;color:#dce2eb}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #354154;border-radius:999px;padding:3px 8px;font-size:12px;color:#dce2eb;background:#18202a}.pill.warn{border-color:#d7a83b;color:#f1d27d}.pill.info{border-color:#6aa6ff;color:#acd0ff}.pill.ok{border-color:#4da86b;color:#95e4aa}.empty{padding:36px;text-align:center;color:#98a3b3}@media(max-width:1100px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.top-inner{align-items:flex-start;flex-direction:column}}
</style>
</head><body>
<header class="top"><div class="top-inner"><div><h1>P0第二批分类纠偏工作台</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="legacy_p0_batch_a_workbench.html?v=batcha7">第一批工作台</a><a class="btn" href="legacy_p0_update_batches.html?v=batch1">P0批次</a><a class="btn" href="index_classification_v2_legacy1609_mapped.html?v=map4">旧报告映射</a></div></div></header>
<main class="wrap"><div class="summary" id="summary"></div>
<section class="panel"><div class="note">第二批不急着写长报告，先把旧分类与真实主营之间的冲突固定下来。旧报告仍低权重保留，本页只作为“分类纠偏底稿 + 后续证据队列”。</div></section>
<section class="panel"><div class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="materials">电子材料</button><button class="btn" data-filter="metals">战略金属</button><button class="btn" data-filter="finance">财务已补</button><div class="search"><input id="search" placeholder="搜索公司 / 代码 / 旧分类 / 新分类 / 主营"></div></div><div id="content"></div></section>
</main>
<script src="legacy_p0_batch_b_workbench_v1.js"></script>
<script>
const DATA=typeof LEGACY_P0_BATCH_B_WORKBENCH_V1!=="undefined"?LEGACY_P0_BATCH_B_WORKBENCH_V1:{rows:[],summary:{}};let active='all',q='';
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pill(text,cls){return '<span class="pill '+(cls||'info')+'">'+esc(text)+'</span>'}
function kpi(label,value){return '<div class="kpi"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function filtered(){const term=q.trim().toLowerCase();return DATA.rows.filter(r=>{const node=r.mapped_node_name||'';if(active==='materials'&&!node.includes('电子材料'))return false;if(active==='metals'&&!node.includes('金属'))return false;if(active==='finance'&&!((r.financial_front_fields||{}).period))return false;if(!term)return true;return [r.name,r.code,r.old_path,r.mapped_node_name,r.mapping_reason,r.correction_note,(r.business_evidence||{}).business_summary].join(' ').toLowerCase().includes(term)})}
function renderSummary(){const s=DATA.summary||{};document.getElementById('summary').innerHTML=[['第二批',s.total],['主营已补',s.business_ready],['财务已补',s.financial_ready],['行情已补',s.market_ready],['电子材料',s.electronic_materials],['战略金属',s.strategic_metals]].map(x=>'<div class="metric"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>').join('');document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · 批次B只做纠偏底稿，不替换旧报告'}
function card(r){const b=r.business_evidence||{},f=r.financial_front_fields||{},m=r.market_strength||{},c=r.concept_role||{},p=r.partner_evidence||{};return '<article class="card"><div class="name"><span class="rank">#'+esc(r.execution_order)+'</span>'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="pill-row">'+pill(r.workflow_status,'ok')+pill(r.mapped_node_name,'info')+pill(r.mapping_reason,'warn')+'</div><div class="path">'+esc(r.old_path)+' → '+esc(r.mapped_node_name)+'</div><div class="kpis">'+kpi('净利润',f.net_profit_attr_yi!==undefined&&f.net_profit_attr_yi!==''?String(f.net_profit_attr_yi)+'亿':'待补')+kpi('净利润同比',f.net_profit_yoy_pct!==undefined&&f.net_profit_yoy_pct!==''?String(f.net_profit_yoy_pct)+'%':'待补')+kpi('改善状态',f.improvement)+kpi('报告期',f.period||'待补')+'</div><div class="kpis">'+kpi('强度分',m.strength_score!==undefined?m.strength_score:'待补')+kpi('20日涨跌',m.ret_20d_pct!==undefined&&m.ret_20d_pct!==''?String(m.ret_20d_pct)+'%':'待补')+kpi('5日涨跌',m.ret_5d_pct!==undefined&&m.ret_5d_pct!==''?String(m.ret_5d_pct)+'%':'待补')+kpi('量能比',m.volume_ratio_5d_vs_20d||'待补')+'</div><div class="section-title">纠偏说明</div><div class="text">'+esc(r.correction_note)+'</div><div class="section-title">主营与产品</div><div class="text">'+esc(b.business_summary||'待补主营业务证据')+'</div><div class="pill-row">'+(b.product_names||b.product_types||[]).map(x=>pill(x,'info')).join('')+'</div><div class="section-title">上下游合作对象</div><div class="text">'+esc(p.status)+'：'+esc(p.note)+'</div><div class="section-title">市场角色</div><div class="pill-row">'+pill(m.status||c.concept_strength_status,'warn')+pill(c.market_role,'info')+'</div><div class="section-title">剩余缺口</div><div class="pill-row">'+(r.remaining_gaps||[]).map(x=>pill(x,'warn')).join('')+'</div><div class="section-title">本批次规则</div><div class="text">'+esc(r.replace_rule)+'</div>'+(r.old_report_path?'<div class="pill-row"><a class="btn" href="'+encodeURI(r.old_report_path)+'">打开旧报告</a></div>':'')+'</article>'}
function render(){renderSummary();document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',active===b.dataset.filter);b.onclick=()=>{active=b.dataset.filter;render()}});const list=filtered();document.getElementById('content').innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">没有匹配项</div>'}
document.getElementById('search').addEventListener('input',e=>{q=e.target.value;render()});render();
</script></body></html>
