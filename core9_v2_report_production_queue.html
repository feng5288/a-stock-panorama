<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页1-9完整V2报告生产队列</title><script src="core9_v2_report_production_queue_v1.js"></script><style>
  :root{--ink:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f7f8fb;--panel:#fff;--red:#b91c1c;--blue:#1d4ed8;--amber:#b45309;--green:#166534}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:22px 28px;background:#111827;color:white}h1{margin:0 0 8px;font-size:24px}.sub{color:#d1d5db;font-size:13px;line-height:1.6}main{padding:22px 28px 42px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.nav a{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-decoration:none;color:#111827;font-size:13px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0 18px}.metric{background:white;border:1px solid var(--line);border-radius:8px;padding:12px}.metric b{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}.toolbar input,.toolbar select{height:34px;border:1px solid var(--line);border-radius:6px;background:white;padding:0 10px}.tag{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:12px;background:#f3f4f6;color:#374151}.tag.red{background:#fee2e2;color:#991b1b}.tag.blue{background:#dbeafe;color:#1d4ed8}.tag.amber{background:#fff7ed;color:#9a3412}.tag.green{background:#dcfce7;color:#166534}table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--line)}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-size:13px;vertical-align:top}th{background:#f3f4f6}.small{font-size:12px;color:var(--muted);line-height:1.45}.nowrap{white-space:nowrap}.card{background:white;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:17px;display:flex;gap:8px;flex-wrap:wrap}.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px;line-height:1.55}.kv div:nth-child(odd){color:var(--muted)}
  </style>
</head><body><header><h1>首页1-9完整V2报告生产队列</h1><div id="subtitle" class="sub"></div></header><main><div class="nav"><a href="core9_v2_first_batch.html?v=next4">首批名单</a><a href="core9_v2_report_production_queue.html?v=prod1">报告生产队列</a><a href="core9_v2_report_batch_001.html?v=batch001">batch_001</a></div><div id="app"></div></main><script>function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}function metric(label,value){return '<div class="metric"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}function tag(s){let c=s.includes('外部')?'red':s.includes('已有')?'green':s.includes('旧')?'amber':'blue';return '<span class="tag '+c+'">'+esc(s)+'</span>'}
const data=CORE9_V2_REPORT_PRODUCTION_QUEUE_V1;document.getElementById('subtitle').textContent=data.purpose+' 生成时间：'+data.generated_at;const app=document.getElementById('app');
function render(){const status=document.getElementById('status')?.value||'全部';const q=(document.getElementById('q')?.value||'').trim();let rows=data.rows.filter(r=>(status==='全部'||r.production_status===status)&&(!q||r.code.includes(q)||r.name.includes(q)||r.primary_concept_name.includes(q)));document.getElementById('rows').innerHTML=rows.map((r,i)=>'<tr><td class="nowrap">'+(i+1)+'</td><td class="nowrap">'+esc(r.code)+'<br>'+esc(r.name)+'</td><td>'+esc(r.primary_concept_name)+'<br><span class="small">'+esc((r.concepts||[]).join(' / '))+'</span></td><td>'+tag(r.production_status)+'<br><span class="small">'+esc(r.report_status_current)+' / '+esc(r.report_kind_current)+'</span></td><td>'+esc(r.production_priority_score)+'</td><td>'+esc(r.old_report_text_chars)+'</td><td>'+esc(r.suggested_batch||'后续批次')+'<br><span class="small">'+esc(r.batch_reason||'')+'</span></td><td class="small">'+esc((r.needs||[]).join('；'))+'</td></tr>').join('')}
app.innerHTML='<div class="summary">'+metric('唯一公司',data.summary.unique_companies)+metric('待生成/升级',data.summary.needs_generation_or_upgrade)+metric('已有V2锚点',data.summary.existing_v2_anchor)+metric('batch_001',data.summary.batch_001_count)+'</div><div class="toolbar"><select id="status"><option>全部</option>'+[...new Set(data.rows.map(r=>r.production_status))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><input id="q" placeholder="搜索代码/名称/概念"></div><table><thead><tr><th>#</th><th>公司</th><th>概念</th><th>状态</th><th>优先分</th><th>旧报告字数</th><th>批次</th><th>需求</th></tr></thead><tbody id="rows"></tbody></table>';document.getElementById('status').addEventListener('change',render);document.getElementById('q').addEventListener('input',render);render();</script></body></html>
