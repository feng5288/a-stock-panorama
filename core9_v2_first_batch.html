<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页1-9完整V2首批名单</title>
  <script src="core9_v2_first_batch_v1.js"></script>
  <style>
    :root{--accent:#1d4ed8;--ink:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f7f8fb;--panel:#fff;}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:22px 28px;background:linear-gradient(90deg,#111827,#374151);color:white}h1{font-size:24px;margin:0 0 8px}.sub{color:#d1d5db;font-size:13px;line-height:1.6}
    main{padding:22px 28px 40px}.nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.nav a{color:#111827;text-decoration:none;background:white;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}.nav a.active{background:var(--accent);color:white;border-color:var(--accent)}
    .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0 18px}.metric{background:white;border:1px solid var(--line);border-radius:8px;padding:12px}.metric b{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 16px}.toolbar input,.toolbar select{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:white}.hint{font-size:12px;color:var(--muted)}
    .grid{display:grid;gap:12px}.card{background:white;border:1px solid var(--line);border-radius:8px;padding:14px}.card h3{font-size:17px;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;background:#eef2ff;color:#3730a3}.tag.ok{background:#fee2e2;color:#991b1b}.tag.mid{background:#fff7ed;color:#9a3412}.tag.gray{background:#f3f4f6;color:#374151}.tag.blue{background:#dbeafe;color:#1d4ed8}.tag.green{background:#dcfce7;color:#166534}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px;line-height:1.55}.kv div:nth-child(odd){color:var(--muted)}
    table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-size:13px;vertical-align:top}th{background:#f3f4f6;color:#374151;position:sticky;top:0}tr:hover td{background:#fafafa}.nowrap{white-space:nowrap}.small{font-size:12px;color:var(--muted);line-height:1.45}.section-title{font-size:18px;margin:22px 0 10px}
  </style>

</head>
<body>
<header><h1>首页1-9完整V2首批名单</h1><div class="sub" id="subtitle"></div></header>
<main>
  <div class="nav">
    <a href="core9_external_evidence_cards.html?v=next4">外部候选证据卡</a>
    <a href="core9_gap_resolution.html?v=next4">证据不足处理</a>
    <a href="core9_deferred_legacy_queue.html?v=next4">旧路径延期</a>
    <a href="core9_v2_first_batch.html?v=next4">V2首批名单</a>
  </div>
  <div id="app"></div>
</main>
<script>

function esc(v){return String(v ?? '').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function num(v, unit=''){return v===null||v===undefined||v===''?'--':esc(v)+unit;}
function metric(label, value){return '<div class="metric"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>';}
function setActive(name){document.querySelectorAll('.nav a').forEach(a=>{if(a.getAttribute('href').startsWith(name))a.classList.add('active')});}

setActive('core9_v2_first_batch.html');
const data = CORE9_V2_FIRST_BATCH_V1;
document.getElementById('subtitle').textContent = data.purpose + ' 生成时间：' + data.generated_at;
const app=document.getElementById('app');
function conceptOptions(){return '<option value="全部">全部概念</option>'+data.concepts.map(c=>'<option value="'+esc(c.concept_id)+'">'+esc(c.seq)+'. '+esc(c.concept_name)+'（'+c.first_batch_count+'）</option>').join('');}
function render(){const c=document.getElementById('concept')?.value||'全部';const q=(document.getElementById('q')?.value||'').trim();let rows=data.rows.filter(r=>(c==='全部'||r.concept_id===c)&&(!q||r.code.includes(q)||r.name.includes(q)||r.concept_name.includes(q)));document.getElementById('rows').innerHTML=rows.map(r=>'<tr><td class="nowrap">'+esc(r.concept_seq)+'. '+esc(r.concept_name)+'</td><td class="nowrap">'+esc(r.code)+'<br>'+esc(r.name)+'</td><td><span class="tag '+(r.report_kind==='v2'?'green':r.report_kind==='external_candidate'?'ok':'mid')+'">'+esc(r.report_status||r.report_kind||'待补')+'</span><br><span class="small">'+esc(r.source_type)+'｜'+esc(r.source_decision)+'</span></td><td>'+num(r.score)+'</td><td>'+esc(r.target_landing||'')+'</td><td>'+esc(r.next_action||'')+'</td></tr>').join('');}
app.innerHTML='<div class="summary">'+metric('概念-公司关系',data.summary.first_batch_memberships)+metric('唯一公司',data.summary.first_batch_unique_companies)+metric('已有V2关系',data.summary.v2_ready_memberships)+metric('待生成/升级',data.summary.needs_v2_memberships)+'</div><h2 class="section-title">分概念概览</h2><div class="summary">'+data.concepts.map(c=>metric(c.seq+'. '+c.concept_name, c.first_batch_count+' 家')).join('')+'</div><div class="toolbar"><select id="concept">'+conceptOptions()+'</select><input id="q" placeholder="搜索代码/名称/概念"><span class="hint">首批名单用于后续批量生成完整V2报告；不是线上最终分类。</span></div><table><thead><tr><th>概念</th><th>公司</th><th>报告/来源</th><th>分数</th><th>拟落点</th><th>下一步</th></tr></thead><tbody id="rows"></tbody></table>';
document.getElementById('concept').addEventListener('change',render);document.getElementById('q').addEventListener('input',render);render();

</script>
</body>
</html>
