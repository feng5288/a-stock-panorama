<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P0分类质量诊断</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#0f1115;color:#e7e9ee}a{color:#86bdff;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:#0f1115;border-bottom:1px solid #2a2f3a}.top-inner{max-width:1500px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:20px}.meta{font-size:12px;color:#9aa4b2}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2d3542;background:#171c24;color:#d8dde6;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.btn.active{border-color:#6aa6ff;background:#10233c;color:#fff}.wrap{max-width:1500px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#171c24;border:1px solid #2a2f3a;border-radius:8px;padding:12px}.metric b{display:block;font-size:24px}.metric span{font-size:12px;color:#9aa4b2}.panel{background:#171c24;border:1px solid #2a2f3a;border-radius:8px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(450px,1fr));gap:12px}.card{border:1px solid #2a2f3a;border-left:4px solid #4fb06d;background:#11161e;border-radius:8px;padding:14px}.card.high{border-left-color:#d95040}.card.medium{border-left-color:#d7a530}.card.low{border-left-color:#6aa6ff}.name{font-weight:800;font-size:16px;margin-bottom:6px}.path{font-size:13px;color:#d7dce5;margin-bottom:10px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.kpi{background:#0f1115;border:1px solid #252b36;border-radius:8px;padding:8px;min-height:62px}.kpi b{display:block;font-size:15px;color:#fff;overflow-wrap:anywhere}.kpi span{display:block;font-size:11px;color:#9aa4b2;margin-top:4px}.section-title{font-size:12px;color:#9aa4b2;margin-top:10px;margin-bottom:5px}.text{font-size:13px;line-height:1.65;color:#d8dde6}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #2d3542;border-radius:999px;padding:3px 8px;font-size:12px;color:#d8dde6;background:#171c24}.pill.high{border-color:#d95040;color:#ffb1a8}.pill.medium{border-color:#d7a530;color:#f1d17a}.pill.low{border-color:#6aa6ff;color:#a9ceff}.pill.ok{border-color:#4fb06d;color:#8be5a2}.note{font-size:13px;color:#c6ccd6;line-height:1.7}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #2a2f3a;text-align:left;padding:8px}.table th{color:#9aa4b2}@media(max-width:980px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
</head>
<body><header class="top"><div class="top-inner"><div><h1>P0分类质量诊断</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="p0_evidence_cards_preview.html?v=p0cards1">P0证据卡</a><a class="btn" href="classification_v2_preview.html?v=rules1">分类预览</a><a class="btn" href="index_classification_v2.html?v=power2">新版首页</a></div></div></header>
<main class="wrap"><div class="summary" id="summary"></div><section class="panel"><div class="note">这页用于决定先修哪些分类规则。它把低主题分、细分命中弱、疑似错配、旧报告证据弱但新证据已修复、基本面偏弱等情况分开，避免把所有问题都变成人工逐只复核。</div></section><section class="panel"><div class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="high">高优先级</button><button class="btn" data-filter="medium">中优先级</button><button class="btn" data-filter="mismatch">疑似错配</button><button class="btn" data-filter="underestimated">评分低估</button><button class="btn" data-filter="childweak">细分命中弱</button></div><div id="content"></div></section><section class="panel"><div class="section-title">主分类风险分布</div><table class="table" id="bucketTable"></table></section></main>
<script src="p0_classification_quality_diagnosis_v1.js"></script>
<script>
var DATA=typeof P0_CLASSIFICATION_QUALITY_DIAGNOSIS_V1!=="undefined"?P0_CLASSIFICATION_QUALITY_DIAGNOSIS_V1:{rows:[],summary:{},by_bucket:[]};
var rows=DATA.rows||[];var active='all';
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function has(r,t){return (r.issue_types||[]).indexOf(t)>=0}
function filtered(){return rows.filter(function(r){if(active==='all')return true;if(active==='high')return r.severity==='high';if(active==='medium')return r.severity==='medium';if(active==='mismatch')return has(r,'possible_mismatch');if(active==='underestimated')return has(r,'score_underestimated');if(active==='childweak')return has(r,'no_business_child_hit');return true})}
function kpi(label,value){return '<div class="kpi"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function pill(text,cls){return '<span class="pill '+cls+'">'+esc(text)+'</span>'}
function renderSummary(){var s=DATA.summary||{};document.getElementById('summary').innerHTML=[["样本",s.total],["高优先级",s.high],["中优先级",s.medium],["疑似错配",s.possible_mismatch],["评分低估",s.score_underestimated],["细分命中弱",s.no_business_child_hit]].map(function(x){return '<div class="metric"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>'}).join('');document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · 基于P0 80家证据卡'}
function card(r){var sev=r.severity||'ok';var cls=sev==='high'?'high':sev==='medium'?'medium':sev==='low'?'low':'ok';return '<article class="card '+cls+'"><div class="name">'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="path">'+esc(r.bucket)+' / '+esc(r.subcategory)+'</div><div class="pill-row">'+pill(r.diagnosis_label,cls)+pill(r.severity,cls)+'</div><div class="kpis">'+kpi('主题纯度',r.theme_purity_score)+kpi('基本面草分',r.fundamental_score)+kpi('旧证据等级',r.original_evidence_level)+kpi('净利改善',r.improvement)+'</div><div class="section-title">诊断理由</div><div class="text">'+(r.diagnosis_reasons||[]).map(esc).join('；')+'</div><div class="section-title">建议动作</div><div class="text">'+esc(r.recommended_action)+'</div><div class="section-title">新主营资料命中</div><div class="pill-row">'+((r.business_root_hits||[]).map(function(x){return pill('主类:'+x,'ok')}).join('')||(pill('主类未命中','medium')))+((r.business_child_hits||[]).map(function(x){return pill('细分:'+x,'ok')}).join('')||(pill('细分未命中','medium')))+'</div><div class="section-title">主营摘要</div><div class="text">'+esc(r.business_summary)+'</div></article>'}
function renderBuckets(){document.getElementById('bucketTable').innerHTML='<thead><tr><th>主分类</th><th>样本</th><th>高风险</th><th>中风险</th><th>主题均分</th></tr></thead><tbody>'+((DATA.by_bucket||[]).map(function(b){return '<tr><td>'+esc(b.bucket)+'</td><td>'+esc(b.total)+'</td><td>'+esc(b.high)+'</td><td>'+esc(b.medium)+'</td><td>'+esc(b.avg_theme)+'</td></tr>'}).join(''))+'</tbody>'}
function render(){renderSummary();renderBuckets();document.querySelectorAll('[data-filter]').forEach(function(b){b.classList.toggle('active',active===b.dataset.filter);b.onclick=function(){active=b.dataset.filter;render()}});var list=filtered();document.getElementById('content').innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="note">没有匹配项</div>'}
render();
</script></body></html>
