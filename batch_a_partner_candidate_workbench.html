<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>批次A合作对象候选线索</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#11151b;color:#e8ebf0}a{color:#8fc4ff;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:#11151b;border-bottom:1px solid #2b3340}.top-inner{max-width:1540px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:21px}.meta{font-size:12px;color:#98a3b3;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #303a49;background:#18202a;color:#dfe5ee;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.btn.active{border-color:#73a9ff;background:#10233d;color:#fff}.wrap{max-width:1540px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#18202a;border:1px solid #2b3340;border-radius:8px;padding:12px}.metric b{display:block;font-size:24px}.metric span{font-size:12px;color:#98a3b3}.panel{background:#18202a;border:1px solid #2b3340;border-radius:8px;padding:14px;margin-bottom:14px}.note{font-size:13px;line-height:1.75;color:#ccd3de}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search{min-width:260px;flex:1}.search input{width:100%;background:#10161d;border:1px solid #303a49;border-radius:8px;color:#fff;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:12px}.card{border:1px solid #2b3340;background:#10161d;border-radius:8px;padding:14px}.name{font-weight:800;font-size:16px;margin-bottom:8px}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{border:1px solid #354154;border-radius:999px;padding:3px 8px;font-size:12px;color:#dce2eb;background:#18202a}.pill.red{border-color:#d85b4a;color:#ffb5aa}.pill.yellow{border-color:#d7a83b;color:#f1d27d}.pill.blue{border-color:#6aa6ff;color:#acd0ff}.item{border-top:1px solid #26303c;padding:10px 0}.item:first-of-type{border-top:0}.item-title{font-size:13px;font-weight:800;margin-bottom:6px}.text{font-size:13px;line-height:1.65;color:#dce2eb;white-space:pre-wrap}.muted{color:#98a3b3}.empty{padding:36px;text-align:center;color:#98a3b3}@media(max-width:1100px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.top-inner{align-items:flex-start;flex-direction:column}}
</style>
</head><body>
<header class="top"><div class="top-inner"><div><h1>批次A合作对象候选线索</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="legacy_p0_batch_a_workbench.html?v=batcha5">批次A工作台</a><a class="btn" href="legacy_p0_update_batches.html?v=batch1">P0批次</a></div></div></header>
<main class="wrap"><div class="summary" id="summary"></div>
<section class="panel"><div class="note">这一页只展示“候选线索”，不是确认合作对象。提问里出现英伟达、三星、谷歌等名称，但公司回答没有明确承认时，仍然标为“不能写入”；公告标题也只作为全文解析入口。</div></section>
<section class="panel"><div class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="blocked">不能写入</button><button class="btn" data-filter="fulltext">待全文</button><button class="btn" data-filter="low">低置信</button><div class="search"><input id="search" placeholder="搜索公司 / 问题 / 回答 / 公告标题"></div></div><div id="content"></div></section>
</main>
<script src="batch_a_partner_candidate_workbench_v1.js"></script>
<script>
const DATA=typeof BATCH_A_PARTNER_CANDIDATE_WORKBENCH_V1!=="undefined"?BATCH_A_PARTNER_CANDIDATE_WORKBENCH_V1:{rows:[],summary:{}};let active='all',q='';
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pill(t,cls){return '<span class="pill '+(cls||'blue')+'">'+esc(t)+'</span>'}
function metric(label,value){return '<div class="metric"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function itemHtml(item){const cls=item.risk_level==='不能写入'?'red':(item.risk_level==='待解析'?'yellow':'blue');const title=item.title||item.question||'候选线索';return '<div class="item"><div class="item-title">'+esc(item.order)+'. '+esc(item.kind)+'</div><div class="pill-row">'+pill(item.risk_level,cls)+pill(item.source,'blue')+(item.question_time?pill(item.question_time,'blue'):'')+(item.partners_mentioned_by_question||[]).map(x=>pill('提问提及 '+x,'yellow')).join('')+'</div><div class="text"><b>'+esc(title)+'</b></div>'+(item.answer?'<div class="text muted">回答：'+esc(item.answer)+'</div>':'<div class="text muted">回答：无明确确认文本</div>')+(item.url?'<div class="pill-row"><a class="btn" href="'+esc(item.url)+'" target="_blank">打开公告入口</a></div>':'')+'<div class="text muted">'+esc(item.reason)+'</div></div>'}
function filteredRows(){const term=q.trim().toLowerCase();return DATA.rows.filter(r=>{const blob=[r.name,r.code,JSON.stringify(r.candidates)].join(' ').toLowerCase();if(term&&!blob.includes(term))return false;if(active==='blocked')return r.blocked_count>0;if(active==='fulltext')return r.fulltext_count>0;if(active==='low')return r.low_confidence_count>0;return true})}
function render(){const s=DATA.summary||{};document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--');document.getElementById('summary').innerHTML=[['公司数',s.companies],['候选线索',s.candidate_items],['不能写入',s.blocked_items],['待全文',s.fulltext_items],['低置信',s.low_confidence_items]].map(x=>metric(x[0],x[1])).join('');document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===active);b.onclick=()=>{active=b.dataset.filter;render()}});const rows=filteredRows();document.getElementById('content').innerHTML=rows.length?'<div class="grid">'+rows.map(r=>'<article class="card"><div class="name">'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="pill-row">'+pill(r.partner_status,'yellow')+pill('候选 '+r.candidate_count,'blue')+pill('不能写入 '+r.blocked_count,'red')+pill('待全文 '+r.fulltext_count,'yellow')+'</div>'+r.candidates.map(itemHtml).join('')+'</article>').join('')+'</div>':'<div class="empty">没有匹配项</div>'}
document.getElementById('search').addEventListener('input',e=>{q=e.target.value;render()});render();
</script></body></html>
