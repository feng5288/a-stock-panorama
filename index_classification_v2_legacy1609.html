function virtualById(id){
 var found=null;
 function walk(list){(list||[]).forEach(function(v){if(found)return;if(v.id===id)found=v;else walk(v.children)})}
 walk(virtualConcepts());
 return found;
}
function virtualChildrenOf(id){var v=virtualById(id);return v&&v.children?v.children:[]}
function virtualParentOf(id){
 var parent=null;
 function walk(list,p){(list||[]).forEach(function(v){if(parent)return;if(v.id===id)parent=p;else walk(v.children,v.id)})}
 walk(virtualConcepts(),null);
 return parent;
}
function virtualRootOf(id){
 var cur=id,parent=virtualParentOf(cur);
 while(parent){cur=parent;parent=virtualParentOf(cur)}
 return virtualById(cur);
}
function virtualPath(id){
 var path=[],cur=id;
 while(cur){path.unshift(cur);cur=virtualParentOf(cur)}
 return path;
}
function virtualText(stock){
 return [stock.code,stock.name,stock.primary_industry].concat(stock.secondary_tracks||[]).concat((stock.tags||[]).map(function(t){return [t.name,t.node_name,(t.path||[]).join('/')].join('/')})).join('/').toLowerCase();
}
function stockMatchesVirtual(stock,v){
 var text=virtualText(stock);
 var selfMatch=(v.match||[]).some(function(m){return text.indexOf(String(m).toLowerCase())>=0});
 var parent=virtualParentOf(v.id);
 if(!parent)return selfMatch;
 var root=virtualRootOf(v.id), rootMatch=(root.match||[]).some(function(m){return text.indexOf(String(m).toLowerCase())>=0});
 return rootMatch&&selfMatch;
}
function virtualHit(stock,v){
 var best=null;
 (stock.tags||[]).forEach(function(t){
  var tagText=[t.name,t.node_name,(t.path||[]).join('/')].join('/').toLowerCase();
  if((v.match||[]).some(function(m){return tagText.indexOf(String(m).toLowerCase())>=0})){
   if(!best||t.weight>best.weight)best=t;
  }
 });
 return best?Object.assign({},best,{node_name:v.label}):{node_name:v.label,weight:.68,role:'概念匹配',name:v.label};
}
function virtualStocksFor(id,subtree){
 var v=virtualById(id), buckets=v?(subtree?[v].concat(virtualChildrenOf(id)): [v]):[];
 if(!buckets.length)return[];
 return sortStockHits(stocks().map(function(s){
  var hitV=buckets.find(function(x){return stockMatchesVirtual(s,x)});
  return hitV?{stock:s,hit:virtualHit(s,hitV)}:null;
 }).filter(function(x){return x&&matchQuery(x.stock)&&(!reportOnly||hasDeepReport(x.stock.code))}));
}

function displayGrade(stock){
 if(stock&&stock.legacy_integrated&&!evidenceCard(stock.code))return{label:'旧报告待复核',cls:'risk',rank:0};
 var eg=evidenceGrade(stock);
 if(eg)return eg;
 var fs=stock.financial_signal||{},y=fs.yoy_parent_net_income_pct,profit=fs.net_profit_yi,pe=(REPORTS[stock.code]||{}).pe_ttm;
 var score=0;
 if(typeof y==='number'){if(y>=30)score+=3;else if(y>=8)score+=2;else if(y>=0)score+=1;else if(y<=-20)score-=2;else score-=1}
 if(typeof profit==='number'){if(profit>=50)score+=2;else if(profit>=10)score+=1;else if(profit<0)score-=2}
 if(typeof pe==='number'){if(pe>80)score-=2;else if(pe>45)score-=1;else if(pe>0&&pe<20)score+=1}
 if(score>=4)return{label:'强势改善',cls:'strong',rank:4};
 if(score>=2)return{label:'稳健改善',cls:'steady',rank:3};
 if(score>=0)return{label:'跟踪观察',cls:'watch',rank:2};
 return{label:'承压修复',cls:'risk',rank:1};
}
function gradeScore(stock){return displayGrade(stock).rank}
function sortStockHits(list){
 return list.sort(function(a,b){
  if(sortMode==='grade')return gradeScore(b.stock)-gradeScore(a.stock)||b.hit.weight-a.hit.weight;
  if(sortMode==='improve')return improveScore(b.stock)-improveScore(a.stock);
  if(sortMode==='profit')return profitScore(b.stock)-profitScore(a.stock);
  if(sortMode==='valuation')return valuationScore(a.stock)-valuationScore(b.stock);
  if(sortMode==='duplicate')return mountCountNum(b.stock)-mountCountNum(a.stock);
  return b.hit.weight-a.hit.weight;
 });
}

 if(/紫金矿业/.test(stock.name))tags.push('全球矿业龙头');

 if(/贵州茅台/.test(stock.name))tags.push('高端白酒龙头');
 if(/宁德时代/.test(stock.name))tags.push('动力电池龙头');
 if(/迈瑞医疗/.test(stock.name))tags.push('医疗器械龙头');
 if(!tags.length&&/龙头|全球|高端|国产替代|平台/.test(text))tags.push('优势待核验');
 return tags.slice(0,2);
}
function renderStats(){
 var unmapped=(DATA.unmapped_concepts||[]).length;
 var high=(P0CARDS.rows||[]).filter(function(r){return (r.classification_evidence||{}).theme_purity_score>=88}).length+(NEXTCARDS.rows||[]).filter(function(r){return (r.classification_evidence||{}).theme_purity_score>=88}).length+(EXISTING86CARDS.rows||[]).filter(function(r){return (r.classification_evidence||{}).theme_purity_score>=88}).length+(SEED33CARDS.rows||[]).filter(function(r){return (r.classification_evidence||{}).theme_purity_score>=88}).length;
 document.getElementById('stats').innerHTML=[
  ['公司',DATA.calibrated_count+'家'],
  ['概念节点',nodes().length+'个'],
  ['高纯度证据',high+'家'],
  ['旧报告待补',((DATA.legacy1609_integration||{}).legacy_pending_v2_count||0)+'家'],
  ['待归类概念',unmapped+'个']
 ].map(function(x){return'<div class="stat"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'}).join('');
}
function renderCrumbs(){
 var html='<span class="crumb '+(stack.length===0&&virtualStack.length===0?'active':'')+'" onclick="goHome()">首页</span>';
 if(virtualStack.length){
  virtualStack.forEach(function(id,i){
   var v=virtualById(id);
   html+='<span class="sep">/</span><span class="crumb '+(i===virtualStack.length-1?'active':'')+'" onclick="goVirtualTo('+i+')">'+esc(v?v.label:id)+'</span>';
  });
  document.getElementById('breadcrumb').innerHTML=html;
  return;
 }
 stack.forEach(function(id,i){
  var n=nodeById(id);
  html+='<span class="sep">/</span><span class="crumb '+(i===stack.length-1?'active':'')+'" onclick="goTo('+i+')">'+esc(n?n.name:id)+'</span>';
 });
 document.getElementById('breadcrumb').innerHTML=html;
}
function virtualNodeCard(v,index){
 var count=virtualStocksFor(v.id,true).length;
 return'<article class="card clickable child" onclick="openVirtual(\''+esc(v.id)+'\')"><div class="node-index">'+(index+1)+'</div><div class="name">'+esc(v.label)+'</div><div class="meta"><span class="badge good">'+esc(count)+'家公司</span><span class="badge">'+esc(virtualChildrenOf(v.id).length)+'个子概念</span></div><div class="meta">'+esc(v.desc||'按产业链环节细分')+'</div><div class="arrow">›</div></article>';
}
function nodeCard(n,child,index){
 var concept=conceptFor(n.id), raw=(concept&&concept.raw_tags||n.raw_tags||[]).slice(0,5).join(' / ');
 return'<article class="card clickable '+(child?'child':'node')+'" onclick="openNode(\''+esc(n.id)+'\')"><div class="node-index">'+(typeof index==='number'?index+1:(child?'分':'主'))+'</div><div class="name">'+esc(n.name)+'</div><div class="meta"><span class="badge good">'+esc(n.stock_count||0)+'家公司</span><span class="badge">'+esc(childrenOf(n.id).length)+'个子概念</span></div><div class="meta">'+esc(raw||'暂无标签')+'</div><div class="arrow">›</div></article>';
}
function stockCard(x){
 var s=x.stock,h=x.hit,fs=s.financial_signal||{},href=reportUrl(s.code),ev=evidenceCard(s.code),es=evidenceScores(s);
 var grade=displayGrade(s);
 var adv=advantageTags(s).map(function(t){return'<span class="badge advantage">'+esc(t)+'</span>'}).join('');
 var legacy=s.legacy_integrated&&!ev;var scoreBadges=ev?'<span class="badge grade-'+grade.cls+'">主题 '+fmtNum(es.theme,'')+'</span><span class="badge">基本面 '+fmtNum(es.fundamental,'')+'</span>':(legacy?'<span class="badge warn">旧报告</span><span class="badge">待V2证据</span>':'');
 var scoreRows=ev?'<div class="row"><span>主题 / 基本面</span><span>'+fmtNum(es.theme,'')+' / '+fmtNum(es.fundamental,'')+'</span></div><div class="row"><span>证据状态</span><span>'+esc(es.original==='review'?'旧报告弱，新证据已补':'结构化证据已接入')+'</span></div>':(legacy?'<div class="row"><span>证据状态</span><span>旧报告临时接入，待V2证据卡</span></div><div class="row"><span>旧报告评级</span><span>'+esc(s.legacy_rating||'--')+'</span></div>':'');
 var legacyHref=s.legacy_report_url?encodeURI(s.legacy_report_url):'';var reportBtn=href?'<a class="report-link" target="_blank" rel="noopener noreferrer" href="'+href+'">打开V2深度报告</a>':(legacyHref?'<a class="report-link" target="_blank" rel="noopener noreferrer" href="'+legacyHref+'">打开旧报告</a>':'');return'<article class="card stock stock-'+grade.cls+'"><div class="name">'+esc(s.name)+' <span style="font-size:11px;color:#8b949e">'+esc(s.code)+'</span></div><div class="meta"><span class="badge grade-'+grade.cls+'">'+esc(grade.label)+'</span>'+scoreBadges+adv+'<span class="badge">'+esc(h.node_name)+'</span><span class="badge">W '+fmtNum(h.weight,'')+'</span><span class="badge">挂载 '+mountCountNum(s)+'</span></div><div class="stock-rows">'+scoreRows+'<div class="row"><span>主分类</span><span>'+esc(s.primary_industry)+'</span></div><div class="row"><span>净利润</span><span>'+fmtNum(fs.net_profit_yi,'亿元')+'</span></div><div class="row"><span>同比 / 状态</span><span>'+fmtPct(fs.yoy_parent_net_income_pct)+' / '+esc(fs.improvement_status||'--')+'</span></div><div class="row"><span>PE</span><span>'+fmtNum((REPORTS[s.code]||{}).pe_ttm,'x')+'</span></div></div>'+reportBtn+'</article>';
}
function renderHome(){
 var items=q?searchResults():roots();
 var html='<div class="level-title">'+(q?'搜索结果 · '+items.length+'家公司':'概念图主干 · '+roots().length+'个一级节点')+'</div>';
 if(q){
  html+=items.length?'<div class="card-grid">'+items.map(stockCard).join('')+'</div>':'<div class="empty">没有找到匹配公司</div>';
 }else{
  var mainstream=mainstreamConcepts();
  html='<div class="section-title">主流概念主干</div><div class="card-grid">'+mainstream.map(conceptEntryCard).join('')+'</div>'
   +'<div class="section-title">行业主分类</div><div class="level-title">候选热点池：先放在行业分类区观察，等报告证据和样本数量足够后再升为主流概念主干</div>'
   +'<div class="card-grid">'+candidateHotThemes().map(candidateCard).join('')+'</div>'
   +'<div class="level-title" style="margin-top:16px">正式行业锚点：后续用于全 A 扩容和财报更新</div>'
   +'<div class="card-grid">'+items.map(function(n,i){return nodeCard(n,false,i)}).join('')+'</div>';
 }
 document.getElementById('content').innerHTML=html;
}
function renderNode(id){
 var n=nodeById(id);if(!n){renderHome();return}
 var childNodes=childrenOf(id);
 var list=childNodes.length&&!q?stocksFor(id):leafStocksFor(id);
 var h=nodeHealth(id);
 var html='<div class="level-title">'+esc((n.path||[n.name]).join(' / '))+' · '+(childNodes.length&&!q?'继续选择细分概念':'叶子概念 · '+list.length+'家公司')+'</div>';
 html+='<div class="health"><div class="health-card"><b>公司数</b><span>'+h.count+'</span></div><div class="health-card"><b>平均权重</b><span>'+fmtNum(h.avg,'')+'</span></div><div class="health-card"><b>改善</b><span>'+h.improve+'</span></div><div class="health-card"><b>恶化</b><span>'+h.worse+'</span></div><div class="health-card"><b>重复挂载</b><span>'+h.duplicates+'</span></div></div>';
 html+='<div class="calibration-note">节点校准只用于维护概念图结构：合并=与相邻概念重复度高；拆分=节点里混入了不同产业逻辑；改名=名称不能准确表达公司共同特征。</div>';
 html+='<div class="mark-row"><button class="mark-btn merge'+markClass(id,'merge')+'" onclick="nodeMark(\''+esc(id)+'\',\'merge\')">建议合并</button><button class="mark-btn split'+markClass(id,'split')+'" onclick="nodeMark(\''+esc(id)+'\',\'split\')">建议拆分</button><button class="mark-btn rename'+markClass(id,'rename')+'" onclick="nodeMark(\''+esc(id)+'\',\'rename\')">建议改名</button></div>';
 if(childNodes.length&&!q){
  html+='<div class="card-grid" style="margin-bottom:16px">'+childNodes.map(function(c,i){return nodeCard(c,true,i)}).join('')+'</div>';
 }else if(q){
  html+=list.length?'<div class="card-grid">'+list.map(stockCard).join('')+'</div>':'<div class="empty">当前节点没有匹配公司</div>';
 }else{
  html+=list.length?'<div class="card-grid">'+list.map(stockCard).join('')+'</div>':'<div class="empty">当前叶子概念没有匹配公司</div>';
 }
 document.getElementById('content').innerHTML=html;
}
function renderVirtual(id){
 var v=virtualById(id);if(!v){renderHome();return}
 var childNodes=virtualChildrenOf(id);
 var list=childNodes.length&&!q?virtualStocksFor(id,true):virtualStocksFor(id,false);
 var h=virtualHealth(id);
 var html='<div class="level-title">'+esc(virtualStack.map(function(x){var n=virtualById(x);return n?n.label:x}).join(' / '))+' · '+(childNodes.length&&!q?'继续选择细分概念':'叶子概念 · '+list.length+'家公司')+'</div>';
 html+='<div class="health"><div class="health-card"><b>公司数</b><span>'+h.count+'</span></div><div class="health-card"><b>平均权重</b><span>'+fmtNum(h.avg,'')+'</span></div><div class="health-card"><b>改善</b><span>'+h.improve+'</span></div><div class="health-card"><b>恶化</b><span>'+h.worse+'</span></div><div class="health-card"><b>重复挂载</b><span>'+h.duplicates+'</span></div></div>';
 html+='<div class="calibration-note">这里先按产业链环节做前端概念分层预览；确认后会固化进分类 V2 生成器，作为后续全 A 扩容的正式节点。</div>';
 if(childNodes.length&&!q){
  html+='<div class="card-grid" style="margin-bottom:16px">'+childNodes.map(virtualNodeCard).join('')+'</div>';
 }else if(q){
  html+=list.length?'<div class="card-grid">'+list.map(stockCard).join('')+'</div>':'<div class="empty">当前概念没有匹配公司</div>';
 }else{
  html+=list.length?'<div class="card-grid">'+list.map(stockCard).join('')+'</div>':'<div class="empty">当前叶子概念还没有匹配公司，后续扩容后自动补充</div>';
 }
 document.getElementById('content').innerHTML=html;
}
function renderSide(){
 var hot=hotConceptEntries();
 document.getElementById('hotNodes').innerHTML=hot.map(function(c){
  var target=c.virtual_id||c.node_id;
  return'<div class="small-item small-link" onclick="jumpNode(\''+esc(target)+'\')"><b>'+esc(c.label)+'</b><br>'+esc(c.path)+'<br>命中 '+esc(c.count)+' 家 · 权重 '+fmtNum(c.weight,'')+'</div>';
 }).join('')+'<div class="small-item"><b>说明</b><br>CPO、PCB、液冷/数据中心、光通信、机器人、先进封装、电池新技术、关键材料已作为主流概念入口并行展示；当前是前端预览层，确认后再固化到分类生成器。</div>';
 var unmapped=DATA.unmapped_concepts||[];
 document.getElementById('statusBox').innerHTML=unmapped.length?'还有 '+unmapped.length+' 个待归类概念，扩容前建议先补进概念图。':'当前样本标签已全部归入概念图。后续扩容时，只需要处理新增的待归类概念。';
 var marked=Object.keys(nodeMarks).filter(function(id){return nodeMarks[id]&&Object.keys(nodeMarks[id]).length});
 var suggestions=[];
 nodes().forEach(function(n){
  var h=nodeHealth(n.id);
  if(h.count===0)suggestions.push('<div class="small-item"><b>'+esc(n.name)+'</b><br>暂无公司挂载，扩容前可观察是否保留。</div>');
  else if(h.duplicates>=Math.max(3,Math.ceil(h.count*.6)))suggestions.push('<div class="small-item"><b>'+esc(n.name)+'</b><br>重复挂载偏多，可观察是否需要拆分或收窄标签。</div>');
 });
 marked.forEach(function(id){
  var n=nodeById(id),m=nodeMarks[id]||{},types=[];
  if(m.merge)types.push('合并');if(m.split)types.push('拆分');if(m.rename)types.push('改名');
  suggestions.unshift('<div class="small-item"><b>'+esc(n?n.name:id)+'</b><br>已标记：'+esc(types.join(' / '))+'</div>');
 });
 document.getElementById('suggestBox').innerHTML=suggestions.slice(0,8).join('')||'<div class="small-item">暂无明显结构问题。</div>';
}
function render(){
 if(!DATA){document.getElementById('content').innerHTML='<div class="empty">分类数据未加载</div>';return}
 renderStats();renderCrumbs();renderSide();
 if(virtualStack.length)renderVirtual(virtualStack[virtualStack.length-1]);
 else if(stack.length===0)renderHome();else renderNode(stack[stack.length-1]);
}
function openNode(id){stack.push(id);virtualStack=[];q='';document.getElementById('search').value='';render()}
function openVirtual(id){virtualStack.push(id);stack=[];q='';document.getElementById('search').value='';render()}
function goHome(){stack=[];virtualStack=[];render()}
function goTo(i){stack=stack.slice(0,i+1);render()}
function goVirtualTo(i){virtualStack=virtualStack.slice(0,i+1);render()}
document.getElementById('search').addEventListener('input',function(e){q=e.target.value.trim();render()});
document.getElementById('homeBtn').addEventListener('click',function(){q='';stack=[];virtualStack=[];document.getElementById('search').value='';render()});
document.getElementById('sortMode').addEventListener('change',function(e){sortMode=e.target.value;render()});
document.getElementById('reportOnly').addEventListener('change',function(e){reportOnly=e.target.checked;render()});
render();
</script>
</body>
