<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>1609家公司报告库 - A股全景树</title>
  <style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f3f6f8;color:#15202b;line-height:1.62}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:rgba(247,249,251,.96);border-bottom:1px solid #d9e0e7;backdrop-filter:blur(12px)}.top-inner{max-width:1480px;margin:0 auto;padding:12px 18px;display:flex;justify-content:space-between;gap:14px;align-items:center}.brand h1{font-size:19px}.brand span{display:block;font-size:12px;color:#64717f}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,.nav a{display:inline-flex;align-items:center;border:1px solid #cbd5df;background:#fff;border-radius:8px;padding:8px 10px;font-size:13px;color:#263241}.primary{background:#163b3f!important;color:#fff!important;border-color:#163b3f!important}main{max-width:1480px;margin:0 auto;padding:20px 18px 34px}.hero,.panel{background:#fff;border:1px solid #dce3ea;border-radius:8px;padding:16px}.hero{margin-bottom:14px}.hero h2{font-size:28px;line-height:1.25;margin-bottom:8px}.hero p,.text{font-size:13px;color:#536170}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}.metric{background:#fff;border:1px solid #dce3ea;border-radius:8px;padding:13px;min-height:86px}.metric b{display:block;font-size:26px;line-height:1}.metric span{display:block;font-size:13px;color:#536170;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select{background:#fff;border:1px solid #cbd5df;border-radius:8px;padding:9px 12px;color:#15202b}input{min-width:260px;flex:1}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #dce3ea;border-radius:8px;overflow:hidden}th,td{padding:9px;border-bottom:1px solid #e4eaf0;font-size:12px;text-align:left;vertical-align:top}th{color:#637181;background:#f8fafc}tr:hover{background:#f8fafc}.pill-row{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid #d3dce5;border-radius:999px;background:#f7f9fb;padding:3px 8px;font-size:12px;color:#435160}.ok{border-color:#8cc9b6;color:#12695e;background:#ecf8f5}.warn{border-color:#e4c77c;color:#7b5600;background:#fff8e8}.info{border-color:#a9c6ee;color:#285d9b;background:#f0f6ff}.danger{border-color:#e0a09a;color:#9e342a;background:#fff1ef}.report-link{display:inline-flex;align-items:center;border:1px solid #cbd5df;border-radius:8px;padding:6px 9px;background:#fff;color:#1c4f55}.muted{color:#7a8794}.nowrap{white-space:nowrap}.table-wrap{overflow:auto}@media(max-width:980px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.top-inner{align-items:flex-start;flex-direction:column}}@media(max-width:620px){.metrics{grid-template-columns:1fr}.hero h2{font-size:24px}input{min-width:100%}}
  </style>

</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><h1>A股全景树</h1><span>1609家公司同步总表 · 报告状态</span></div>
      <nav class="nav">
        <a href="index_v2_delivery.html?v=public2">首页</a>
        <a href="concept_radar_public.html?v=radar1">概念雷达</a>
        <a class="primary" href="report_library_public.html?v=master1609">报告库</a>
        <a href="v2_report_samples_public.html?v=samples1">V2样例</a>
        <a href="delivery_briefing_public.html?v=brief1">交付说明</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <h2>1609家公司报告库</h2>
      <p>按公司同步总表展示分类、概念标签和报告状态。已有新版深度报告时优先打开新版；没有新版时保留旧版入口；缺失时标记暂未生成。</p>
    </section>
    <section class="metrics" id="metrics"></section>
    <section class="panel">
      <div class="toolbar">
        <input id="search" placeholder="搜索公司 / 代码 / 分类 / 概念标签">
        <select id="industry"><option value="">全部分类</option></select>
        <select id="status">
          <option value="">全部报告状态</option>
          <option value="v2">新版报告</option>
          <option value="legacy">旧版报告</option>
          <option value="missing">暂未生成</option>
        </select>
        <select id="priority">
          <option value="">全部升级优先级</option>
          <option value="P0">P0</option>
          <option value="P1">P1</option>
          <option value="P2">P2</option>
        </select>
      </div>
      <p class="text" id="resultText"></p>
    </section>
    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>代码</th><th>公司</th><th>分类映射</th><th>概念标签</th><th>评级</th><th>报告状态</th><th>报告入口</th><th>后续动作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="data/company_master_1609.js"></script>
  <script>
const DATA = window.COMPANY_MASTER_1609 || COMPANY_MASTER_1609;
const rows = DATA.companies || [];
const els = {
  metrics: document.getElementById('metrics'),
  search: document.getElementById('search'),
  industry: document.getElementById('industry'),
  status: document.getElementById('status'),
  priority: document.getElementById('priority'),
  rows: document.getElementById('rows'),
  resultText: document.getElementById('resultText')
};
function h(v){return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function metric(label, value){return '<div class="metric"><b>'+h(value)+'</b><span>'+h(label)+'</span></div>';}
function statusClass(s){return s === 'v2' ? 'ok' : s === 'legacy' ? 'warn' : 'danger';}
function renderMetrics(){
  const c = DATA.counts || {};
  els.metrics.innerHTML = [
    metric('同步公司', c.total_companies || rows.length),
    metric('新版报告', c.v2_reports || 0),
    metric('旧版报告', c.legacy_reports || 0),
    metric('暂未生成', c.missing_reports || 0),
    metric('待批量升级', (c.legacy_reports || 0) + (c.missing_reports || 0))
  ].join('');
}
function fillFilters(){
  [...new Set(rows.map(x => x.primary_industry || '待分类'))].sort((a,b)=>a.localeCompare(b,'zh-Hans-CN')).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    els.industry.appendChild(opt);
  });
}
function rowHtml(x){
  const tags = (x.concept_tags || []).slice(0, 5).map(t => '<span class="pill info">'+h(t)+'</span>').join('');
  const tracks = (x.secondary_tracks || []).join(' / ');
  const entry = x.report_path ? '<a class="report-link" href="'+h(x.report_path)+'">'+h(x.report_status === 'v2' ? '打开新版' : '打开旧版')+'</a>' : '<span class="muted">暂无入口</span>';
  return '<tr>'+
    '<td class="nowrap">'+h(x.code || '待补')+'</td>'+
    '<td><strong>'+h(x.name)+'</strong></td>'+
    '<td>'+h(x.primary_industry || '待分类')+(tracks ? '<br><span class="muted">'+h(tracks)+'</span>' : '')+'</td>'+
    '<td><div class="pill-row">'+tags+'</div></td>'+
    '<td class="nowrap">'+h(x.rating || '?')+'</td>'+
    '<td><span class="pill '+statusClass(x.report_status)+'">'+h(x.report_status_label)+'</span></td>'+
    '<td>'+entry+'</td>'+
    '<td><span class="pill">'+h(x.upgrade_priority || '')+'</span> '+h(x.next_action || '')+'</td>'+
  '</tr>';
}
function applyFilters(){
  const q = els.search.value.trim().toLowerCase();
  const industry = els.industry.value;
  const status = els.status.value;
  const priority = els.priority.value;
  const matched = rows.filter(x => {
    const hay = [x.code,x.name,x.primary_industry,(x.secondary_tracks||[]).join(' '),(x.concept_tags||[]).join(' ')].join(' ').toLowerCase();
    return (!q || hay.includes(q)) && (!industry || x.primary_industry === industry) && (!status || x.report_status === status) && (!priority || x.upgrade_priority === priority);
  });
  els.resultText.textContent = '匹配 ' + matched.length + ' 家；默认显示前 500 家。数据生成时间：' + (DATA.generated_at || '');
  els.rows.innerHTML = matched.slice(0,500).map(rowHtml).join('');
}
renderMetrics();
fillFilters();
['input','change'].forEach(evt => {
  els.search.addEventListener(evt, applyFilters);
  els.industry.addEventListener(evt, applyFilters);
  els.status.addEventListener(evt, applyFilters);
  els.priority.addEventListener(evt, applyFilters);
});
applyFilters();
  </script>
</body>
</html>
