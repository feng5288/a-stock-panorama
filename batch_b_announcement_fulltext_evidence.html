function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pill(t,cls){return '<span class="pill '+(cls||'blue')+'">'+esc(t)+'</span>'}
function metric(label,value){return '<div class="metric"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function itemHtml(item){const strong=(item.confirmed_candidates||[]).length>0;const cls=strong?'green':(item.status==='解析失败'?'red':(String(item.status).includes('出现')?'yellow':'blue'));return '<div class="item"><div class="item-title">'+esc(item.title)+'</div><div class="pill-row">'+pill(item.status,cls)+pill('文本 '+(item.text_chars||0)+' 字','blue')+(item.confirmed_candidates||[]).map(x=>pill('强线索 '+x,'green')).join('')+'</div><div class="pill-row">'+(item.file_url?'<a class="btn" target="_blank" href="'+esc(item.file_url)+'">打开PDF</a>':'')+'</div>'+(item.evidence||[]).map(e=>'<div class="snippet"><div class="pill-row">'+pill(e.partner,e.can_confirm?'green':'yellow')+pill(e.has_context?'有关系词':'无关系词',e.has_context?'green':'yellow')+pill(e.has_negative?'含否定/不披露':'无否定',e.has_negative?'red':'blue')+'</div><div class="text muted">'+esc(e.snippet)+'</div></div>').join('')+'</div>'}
function render(){const s=DATA.summary||{};document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--');document.getElementById('summary').innerHTML=[['公司数',s.companies],['公告数',s.announcements],['全文强线索',s.strong_fulltext_items],['解析失败',s.parse_errors]].map(x=>metric(x[0],x[1])).join('');document.getElementById('content').innerHTML='<div class="grid">'+DATA.rows.map(r=>'<article class="card"><div class="name">'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="pill-row">'+pill('公告 '+r.announcement_count,'blue')+pill('强线索 '+r.strong_fulltext_count,r.strong_fulltext_count?'green':'blue')+'</div>'+r.items.map(itemHtml).join('')+'</article>').join('')+'</div>'}
render();
</script></body></html>
