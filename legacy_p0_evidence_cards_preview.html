<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旧报告P0轻量V2证据卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#101318;color:#e7e9ee}a{color:#8abfff;text-decoration:none}.top{position:sticky;top:0;z-index:10;background:#101318;border-bottom:1px solid #2a313d}.top-inner{max-width:1560px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:20px}.meta{font-size:12px;color:#9aa4b2;margin-top:3px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2e3745;background:#171d26;color:#d8dde6;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.btn.active{border-color:#78adff;background:#10233d;color:#fff}.wrap{max-width:1560px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#171d26;border:1px solid #2a313d;border-radius:8px;padding:12px}.metric b{display:block;font-size:23px}.metric span{font-size:12px;color:#9aa4b2}.panel{background:#171d26;border:1px solid #2a313d;border-radius:8px;padding:14px;margin-bottom:14px}.note{font-size:13px;line-height:1.7;color:#c7ced8}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search{min-width:260px;flex:1}.search input{width:100%;background:#11161e;border:1px solid #303948;border-radius:8px;color:#fff;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(470px,1fr));gap:12px}.card{border:1px solid #2a313d;border-left:4px solid #d95040;background:#11161e;border-radius:8px;padding:14px}.name{font-weight:800;font-size:16px;margin-bottom:5px}.path{font-size:13px;color:#d7dce5;margin:7px 0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.kpi{background:#0e1218;border:1px solid #252d39;border-radius:8px;padding:8px;min-height:60px}.kpi b{display:block;font-size:15px;color:#fff;overflow-wrap:anywhere}.kpi span{display:block;font-size:11px;color:#9aa4b2;margin-top:4px}.section-title{font-size:12px;color:#9aa4b2;margin-top:10px;margin-bottom:5px}.text{font-size:13px;line-height:1.65;color:#d8dde6}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #334052;border-radius:999px;padding:3px 8px;font-size:12px;color:#d8dde6;background:#171d26}.pill.hot{border-color:#d95040;color:#ffb1a8}.pill.warn{border-color:#d7a530;color:#f1d17a}.pill.ok{border-color:#4fb06d;color:#8be5a2}.pill.todo{border-color:#6aa6ff;color:#a9ceff}.rank{color:#9aa4b2;font-size:12px;margin-right:4px}.empty{padding:36px;text-align:center;color:#9aa4b2}@media(max-width:980px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.top-inner{align-items:flex-start;flex-direction:column}}
</style>
</head><body>
<header class="top"><div class="top-inner"><div><h1>旧报告P0轻量V2证据卡</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="legacy_report_quality_queue.html?v=q1">质量队列</a><a class="btn" href="index_classification_v2_legacy1609_mapped.html?v=map4">旧报告映射版</a><a class="btn" href="p0_evidence_cards_preview.html?v=p0cards1">原P0证据卡</a></div></div></header>
<main class="wrap"><div class="summary" id="summary"></div>
<section class="panel"><div class="note">这页只处理质量诊断里的 P0 公司。它把“为什么先更新、旧报告哪里弱、当前映射是什么、下一步怎么补证据”做成轻量卡片。后续可以按这 32 家批量补财报、行情强度和深度报告。</div></section>
<section class="panel"><div class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="override">公司纠偏</button><button class="btn" data-filter="conflict">旧标签冲突</button><button class="btn" data-filter="businessWeak">主营证据弱</button><button class="btn" data-filter="large">大市值</button><div class="search"><input id="search" placeholder="搜索公司 / 代码 / 节点 / 问题"></div></div><div id="content"></div></section>
</main>
<script src="legacy_p0_evidence_cards_v1.js"></script>
<script>
var DATA=typeof LEGACY_P0_EVIDENCE_CARDS_V1!=="undefined"?LEGACY_P0_EVIDENCE_CARDS_V1:{rows:[],summary:{}};var rows=DATA.rows||[];var active='all';var q='';
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function has(r,t){return (r.issue_types||[]).indexOf(t)>=0}
function pill(text,cls){return '<span class="pill '+(cls||'todo')+'">'+esc(text)+'</span>'}
function kpi(label,value){return '<div class="kpi"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function filtered(){var term=q.trim().toLowerCase();return rows.filter(function(r){if(active==='override'&&!has(r,'company_override'))return false;if(active==='conflict'&&!has(r,'old_tag_conflict'))return false;if(active==='businessWeak'&&r.evidence_level!=='主营证据弱')return false;if(active==='large'&&!(Number(r.market_cap_yi)>=1000))return false;if(!term)return true;return [r.name,r.code,r.mapped_node_name,r.old_path,r.evidence_level,(r.issue_types||[]).join(' ')].join(' ').toLowerCase().indexOf(term)>=0})}
function renderSummary(){var s=DATA.summary||{};document.getElementById('summary').innerHTML=[['P0卡片',s.total],['公司纠偏',s.company_override],['旧标签冲突',s.old_tag_conflict],['主营证据弱',s.business_weak],['千亿以上',s.large_cap],['覆盖章节均值',s.avg_section_coverage]].map(function(x){return '<div class="metric"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>'}).join('');document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · 来自旧报告质量诊断 P0 队列'}
function card(r){var cov=r.section_coverage||{};var covPills=Object.keys(cov).map(function(k){return pill(k+(cov[k]?'✓':'×'),cov[k]?'ok':'warn')}).join('');return '<article class="card"><div class="name"><span class="rank">#'+esc(r.rank)+'</span>'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="pill-row">'+pill(r.evidence_level,'hot')+pill('队列分 '+r.queue_score,'hot')+pill(r.confidence,'warn')+'</div><div class="path">'+esc(r.old_path)+' → '+esc(r.mapped_node_name)+'</div><div class="kpis">'+kpi('市值',r.market_cap_yi?String(r.market_cap_yi)+'亿':'--')+kpi('旧评级',r.rating||'--')+kpi('映射原因',r.mapping_reason)+kpi('卡片状态',r.evidence_card_status)+'</div><div class="section-title">诊断理由</div><div class="text">'+(r.diagnosis_reasons||[]).map(esc).join('；')+'</div><div class="section-title">旧报告章节覆盖</div><div class="pill-row">'+covPills+'</div><div class="section-title">下一步动作</div><div class="text">'+esc(r.next_action)+'</div><div class="section-title">V2更新计划</div><div class="pill-row">'+(r.v2_update_plan||[]).map(function(x){return pill(x,'todo')}).join('')+'</div><div class="section-title">旧报告关键片段</div><div class="text">'+esc(r.focus_snippet)+'</div>'+(r.old_report_path?'<div class="pill-row"><a class="btn" href="'+encodeURI(r.old_report_path)+'">打开旧报告</a></div>':'')+'</article>'}
function render(){renderSummary();document.querySelectorAll('[data-filter]').forEach(function(b){b.classList.toggle('active',active===b.dataset.filter);b.onclick=function(){active=b.dataset.filter;render()}});var list=filtered();document.getElementById('content').innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">没有匹配项</div>'}
document.getElementById('search').addEventListener('input',function(e){q=e.target.value;render()});render();
</script></body></html>
