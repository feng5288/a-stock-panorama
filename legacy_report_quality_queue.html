<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旧报告质量诊断与V2更新队列</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#101318;color:#e7e9ee}a{color:#8abfff;text-decoration:none}.top{position:sticky;top:0;z-index:10;background:#101318;border-bottom:1px solid #2a313d}.top-inner{max-width:1560px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:20px}.meta{font-size:12px;color:#9aa4b2;margin-top:3px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2e3745;background:#171d26;color:#d8dde6;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.btn.active{border-color:#78adff;background:#10233d;color:#fff}.wrap{max-width:1560px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#171d26;border:1px solid #2a313d;border-radius:8px;padding:12px}.metric b{display:block;font-size:23px}.metric span{font-size:12px;color:#9aa4b2}.panel{background:#171d26;border:1px solid #2a313d;border-radius:8px;padding:14px;margin-bottom:14px}.note{font-size:13px;line-height:1.7;color:#c7ced8}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search{min-width:260px;flex:1}.search input{width:100%;background:#11161e;border:1px solid #303948;border-radius:8px;color:#fff;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(470px,1fr));gap:12px}.card{border:1px solid #2a313d;border-left:4px solid #6aa6ff;background:#11161e;border-radius:8px;padding:14px}.card.P0{border-left-color:#d95040}.card.P1{border-left-color:#d7a530}.card.P2{border-left-color:#6aa6ff}.name{font-weight:800;font-size:16px;margin-bottom:5px}.path{font-size:13px;color:#d7dce5;margin:7px 0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.kpi{background:#0e1218;border:1px solid #252d39;border-radius:8px;padding:8px;min-height:60px}.kpi b{display:block;font-size:15px;color:#fff;overflow-wrap:anywhere}.kpi span{display:block;font-size:11px;color:#9aa4b2;margin-top:4px}.section-title{font-size:12px;color:#9aa4b2;margin-top:10px;margin-bottom:5px}.text{font-size:13px;line-height:1.65;color:#d8dde6}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #334052;border-radius:999px;padding:3px 8px;font-size:12px;color:#d8dde6;background:#171d26}.pill.P0{border-color:#d95040;color:#ffb1a8}.pill.P1{border-color:#d7a530;color:#f1d17a}.pill.P2{border-color:#6aa6ff;color:#a9ceff}.pill.ok{border-color:#4fb06d;color:#8be5a2}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #2a313d;text-align:left;padding:8px;vertical-align:top}.table th{color:#9aa4b2}.rank{color:#9aa4b2;font-size:12px;margin-right:4px}@media(max-width:980px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.top-inner{align-items:flex-start;flex-direction:column}}
</style>
</head><body>
<header class="top"><div class="top-inner"><div><h1>旧报告质量诊断与V2更新队列</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="index_classification_v2_legacy1609_mapped.html?v=map4">旧报告映射版</a><a class="btn" href="legacy1500_preview.html?v=legacy1">旧报告清单</a><a class="btn" href="index_classification_v2_seed33.html?v=seedint1">243家V2底座</a></div></div></header>
<main class="wrap"><div class="summary" id="summary"></div>
<section class="panel"><div class="note">这页用于回答“旧报告很多不准确时，先更新谁”。系统会把旧报告质量、旧标签冲突、映射置信度、热点概念、公司规模等因素合成 P0/P1/P2。旧报告仍然只作为低权重参考，真正进入 P0 的公司才优先补 V2 证据卡或深度报告。</div></section>
<section class="panel"><div class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="P0">P0优先</button><button class="btn" data-filter="P1">P1排队</button><button class="btn" data-filter="P2">P2暂缓</button><button class="btn" data-filter="conflict">标签冲突</button><button class="btn" data-filter="generic">模板化报告</button><button class="btn" data-filter="hot">热点节点</button><div class="search"><input id="search" placeholder="搜索公司 / 代码 / 节点 / 旧分类"></div></div><div id="content"></div></section>
<section class="panel"><div class="section-title">节点风险分布</div><table class="table" id="nodeTable"></table></section>
</main>
<script src="legacy_report_quality_queue_v1.js"></script>
<script>
var DATA=typeof LEGACY_REPORT_QUALITY_QUEUE_V1!=="undefined"?LEGACY_REPORT_QUALITY_QUEUE_V1:{rows:[],summary:{},by_node:[]};var rows=DATA.rows||[];var active='all';var q='';
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function has(r,t){return (r.issue_types||[]).indexOf(t)>=0}
function pill(text,cls){return '<span class="pill '+(cls||'ok')+'">'+esc(text)+'</span>'}
function kpi(label,value){return '<div class="kpi"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function filtered(){var term=q.trim().toLowerCase();return rows.filter(function(r){if(active==='P0'&&r.priority!=='P0')return false;if(active==='P1'&&r.priority!=='P1')return false;if(active==='P2'&&r.priority!=='P2')return false;if(active==='conflict'&&!has(r,'old_tag_conflict')&&!has(r,'company_override'))return false;if(active==='generic'&&!has(r,'generic_report'))return false;if(active==='hot'&&!has(r,'hot_node'))return false;if(!term)return true;return [r.name,r.code,r.mapped_node_name,r.old_path,r.mapping_reason].join(' ').toLowerCase().indexOf(term)>=0})}
function renderSummary(){var s=DATA.summary||{};document.getElementById('summary').innerHTML=[['旧报告队列',s.total],['P0优先',s.P0],['P1排队',s.P1],['P2暂缓',s.P2],['标签冲突',s.old_tag_conflict],['模板化报告',s.generic_report],['热点节点',s.hot_node]].map(function(x){return '<div class="metric"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>'}).join('');document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · 基于旧报告映射版 '+(s.total||0)+' 家'}
function card(r,i){var p=r.priority;return '<article class="card '+p+'"><div class="name"><span class="rank">#'+(i+1)+'</span>'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="pill-row">'+pill(r.priority_label,p)+pill('分数 '+r.score,p)+pill(r.confidence||'无置信度',p)+'</div><div class="path">'+esc(r.old_path)+' → '+esc(r.mapped_node_name)+'</div><div class="kpis">'+kpi('市值',r.market_cap_yi?String(r.market_cap_yi)+'亿':'--')+kpi('旧评级',r.rating||'--')+kpi('模板痕迹',r.generic_marker_count)+kpi('明确关键词',(r.specific_hits||[]).length)+'</div><div class="section-title">诊断理由</div><div class="text">'+(r.diagnosis_reasons||[]).map(esc).join('；')+'</div><div class="section-title">建议动作</div><div class="text">'+esc(r.recommended_action)+'</div><div class="section-title">标签</div><div class="pill-row">'+(r.issue_types||[]).map(function(x){return pill(x,x==='hot_node'?'ok':p)}).join('')+'</div><div class="section-title">旧报告片段</div><div class="text">'+esc(r.report_preview)+'</div>'+(r.html_report_path?'<div class="pill-row"><a class="btn" href="'+encodeURI(r.html_report_path)+'">打开旧报告</a></div>':'')+'</article>'}
function renderNodes(){document.getElementById('nodeTable').innerHTML='<thead><tr><th>节点</th><th>总数</th><th>P0</th><th>P1</th><th>模板化</th><th>标签冲突</th></tr></thead><tbody>'+((DATA.by_node||[]).map(function(n){return '<tr><td>'+esc(n.node)+'</td><td>'+esc(n.total)+'</td><td>'+esc(n.P0)+'</td><td>'+esc(n.P1)+'</td><td>'+esc(n.generic_report)+'</td><td>'+esc(n.conflict)+'</td></tr>'}).join(''))+'</tbody>'}
function render(){renderSummary();renderNodes();document.querySelectorAll('[data-filter]').forEach(function(b){b.classList.toggle('active',active===b.dataset.filter);b.onclick=function(){active=b.dataset.filter;render()}});var list=filtered();document.getElementById('content').innerHTML=list.length?'<div class="grid">'+list.slice(0,420).map(card).join('')+'</div>'+'<div class="meta" style="margin-top:10px">当前显示 '+Math.min(list.length,420)+' / '+list.length+' 条</div>':'<div class="note">没有匹配项</div>'}
document.getElementById('search').addEventListener('input',function(e){q=e.target.value;render()});render();
</script></body></html>
