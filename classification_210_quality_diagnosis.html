<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>210家分类质量诊断</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;background:#0d1117;color:#c9d1d9}a{color:#79c0ff;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:#0d1117;border-bottom:1px solid #21262d}.top-inner{max-width:1500px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;color:#f0f6fc}.meta{font-size:12px;color:#8b949e}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #30363d;background:#161b22;color:#8b949e;border-radius:7px;padding:7px 11px;font-size:12px;cursor:pointer}.btn.active,.btn:hover{color:#58a6ff;border-color:#1f6feb55;background:#1f6feb18}.wrap{max-width:1500px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px}.metric b{display:block;font-size:24px;color:#f0f6fc}.metric span{font-size:12px;color:#8b949e}.panel{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{height:34px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:7px;padding:0 9px}.toolbar input{flex:1;min-width:230px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(455px,1fr));gap:12px}.card{border:1px solid #21262d;border-left:4px solid #2ea043;background:#0d1117;border-radius:8px;padding:14px}.card.high{border-left-color:#f85149}.card.medium{border-left-color:#d29922}.card.low{border-left-color:#58a6ff}.name{font-weight:850;font-size:16px;color:#f0f6fc;margin-bottom:6px}.path{font-size:13px;color:#c9d1d9;margin-bottom:10px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.kpi{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:8px;min-height:62px}.kpi b{display:block;font-size:15px;color:#f0f6fc;overflow-wrap:anywhere}.kpi span{display:block;font-size:11px;color:#8b949e;margin-top:4px}.section-title{font-size:12px;color:#8b949e;margin-top:10px;margin-bottom:5px}.text{font-size:13px;line-height:1.65;color:#c9d1d9}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #30363d;border-radius:999px;padding:3px 8px;font-size:12px;color:#8b949e;background:#21262d}.pill.high{border-color:#f8514955;color:#ff9b9b;background:#f8514922}.pill.medium{border-color:#d2992255;color:#e3b341;background:#d2992220}.pill.low{border-color:#1f6feb55;color:#79c0ff;background:#1f6feb22}.pill.ok{border-color:#23863655;color:#7ee787;background:#23863622}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}.table th,.table td{border-bottom:1px solid #21262d;text-align:left;padding:8px}.table th{color:#8b949e}.note{font-size:13px;color:#c9d1d9;line-height:1.7}.empty{padding:30px;text-align:center;color:#8b949e}@media(max-width:980px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
</head><body><header class="top"><div class="top-inner"><div><h1>210家分类质量诊断</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="index_classification_v2_next.html?v=next2">210家分类树</a><a class="btn" href="next_round_evidence_cards_preview.html?v=nr1">下一轮证据卡</a><a class="btn" href="expansion_batch_dashboard.html?v=ops1">扩容面板</a></div></div></header><main class="wrap"><div id="summary" class="summary"></div><section class="panel"><div class="note" id="method"></div></section><section class="panel"><div class="toolbar"><input id="q" placeholder="搜索公司、代码、分类、问题"><select id="sev"><option value="">全部等级</option><option value="high">高优先级</option><option value="medium">中优先级</option><option value="low">低优先级</option><option value="ok">暂可通过</option></select><select id="batch"><option value="">全部批次</option></select><select id="issue"><option value="">全部问题</option><option value="parent_only">只挂父级</option><option value="possible_mismatch">疑似错配</option><option value="leaf_without_business_support">叶子证据弱</option><option value="missing_evidence_card">待补证据卡</option><option value="excessive_mounts">挂载过多</option><option value="financial_weak">基本面偏弱</option></select></div><div id="content"></div></section><section class="panel"><div class="section-title">主分类风险分布</div><div class="table-wrap"><table class="table" id="bucketTable"></table></div></section></main><script src="classification_210_quality_diagnosis_v1.js"></script><script>const DATA=CLASSIFICATION_210_QUALITY_DIAGNOSIS_V1,rows=DATA.rows||[],$=id=>document.getElementById(id);function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function has(r,t){return(r.issue_types||[]).includes(t)}function pill(t,c){return`<span class="pill ${c||''}">${esc(t)}</span>`}function k(l,v){return`<div class="kpi"><b>${esc(v)}</b><span>${esc(l)}</span></div>`}function renderSummary(){const s=DATA.summary||{};$('summary').innerHTML=[['样本',s.total],['高优先级',s.high],['中优先级',s.medium],['待补证据卡',s.missing_evidence_card],['只挂父级',s.parent_only],['叶子证据弱',s.leaf_without_business_support]].map(x=>`<div class="metric"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('');$('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · P0 '+s.p0+' / NEXT44 '+s.next44+' / EXISTING86 '+s.existing86+' / 待补 '+s.existing_only;$('method').textContent=DATA.method_note||''}function setup(){const batches=[...new Set(rows.map(r=>r.batch))].sort();$('batch').innerHTML='<option value="">全部批次</option>'+batches.map(b=>`<option>${esc(b)}</option>`).join('');['q','sev','batch','issue'].forEach(id=>$(id).addEventListener('input',render))}function filtered(){const q=$('q').value.trim().toLowerCase(),sev=$('sev').value,b=$('batch').value,issue=$('issue').value;return rows.filter(r=>{const text=[r.code,r.name,r.primary_industry,r.primary_leaf,r.diagnosis_label,r.recommended_action,(r.issue_types||[]).join(' ')].join(' ').toLowerCase();return(!q||text.includes(q))&&(!sev||r.severity===sev)&&(!b||r.batch===b)&&(!issue||has(r,issue))})}function card(r){const cls=r.severity||'ok';return`<article class="card ${cls}"><div class="name">${esc(r.name)} <span class="meta">${esc(r.code)} · ${esc(r.batch)}</span></div><div class="path">${esc(r.primary_industry)} / ${esc(r.primary_leaf)}</div><div class="pill-row">${pill(r.diagnosis_label,cls)}${pill(r.severity,cls)}</div><div class="kpis">${k('挂载节点',r.mount_count)}${k('主线数',r.root_count)}${k('叶子数',r.leaf_count)}${k('主题纯度',r.theme_purity_score)}${k('基本面',r.fundamental_score)}${k('净利润(亿)',r.net_profit_yi)}${k('净利同比',r.net_profit_yoy_pct)}${k('改善',r.improvement)}</div><div class="section-title">诊断理由</div><div class="text">${(r.diagnosis_reasons||[]).map(esc).join('；')}</div><div class="section-title">建议动作</div><div class="text">${esc(r.recommended_action)}</div><div class="section-title">叶子标签</div><div class="pill-row">${(r.leaf_tags||[]).slice(0,6).map(t=>pill((t.node_name||t.name)+' W '+t.weight,'ok')).join('')||pill('无叶子标签','high')}</div></article>`}function renderBuckets(){$('bucketTable').innerHTML='<thead><tr><th>主分类</th><th>样本</th><th>高风险</th><th>中风险</th><th>待补证据</th><th>主题均分</th></tr></thead><tbody>'+(DATA.by_bucket||[]).map(b=>`<tr><td>${esc(b.bucket)}</td><td>${esc(b.total)}</td><td>${esc(b.high)}</td><td>${esc(b.medium)}</td><td>${esc(b.missing_evidence)}</td><td>${esc(b.avg_theme)}</td></tr>`).join('')+'</tbody>'}function render(){renderSummary();renderBuckets();const list=filtered();$('content').innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">没有匹配项</div>'}setup();render();</script></body></html>
