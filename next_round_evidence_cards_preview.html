<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下一轮44家轻量证据卡</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;background:#0d1117;color:#c9d1d9}a{color:#79c0ff;text-decoration:none}.top{position:sticky;top:0;background:#0d1117;border-bottom:1px solid #21262d;z-index:5}.top-inner{max-width:1480px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;color:#f0f6fc}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #30363d;background:#161b22;color:#8b949e;border-radius:7px;padding:7px 11px;font-size:12px}.btn.primary{color:#58a6ff;border-color:#1f6feb55;background:#1f6feb18}.wrap{max-width:1480px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px}.metric b{display:block;color:#f0f6fc;font-size:23px}.metric span{font-size:12px;color:#8b949e}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{height:34px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:7px;padding:0 9px}.toolbar input{flex:1;min-width:230px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}.card{background:#161b22;border:1px solid #21262d;border-left:4px solid #58a6ff;border-radius:8px;padding:14px}.card.high{border-left-color:#f85149}.card.mid{border-left-color:#d29922}.name{font-weight:850;color:#f0f6fc;font-size:16px}.meta{font-size:12px;color:#8b949e;margin-top:5px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:11px 0}.kpi{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:8px;min-height:60px}.kpi b{display:block;color:#f0f6fc;font-size:15px;overflow-wrap:anywhere}.kpi span{display:block;color:#8b949e;font-size:11px;margin-top:4px}.business{font-size:13px;line-height:1.65}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{border:1px solid #30363d;background:#21262d;color:#8b949e;border-radius:999px;padding:3px 8px;font-size:11px}.pill.good{color:#7ee787;border-color:#23863655;background:#23863622}.pill.warn{color:#e3b341;border-color:#d2992255;background:#d2992220}.empty{padding:28px;text-align:center;color:#8b949e}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}</style>
</head><body><header class="top"><div class="top-inner"><div><h1>下一轮44家 · 轻量证据卡</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="expansion_batch_dashboard.html?v=ops1">扩容面板</a><a class="btn" href="index_classification_v2_p0.html?v=p0integrated1">P0接入版</a><a class="btn primary" href="next_round_evidence_cards_preview.html?v=nr1">下一轮证据卡</a></div></div></header><main class="wrap"><div id="summary" class="summary"></div><div class="toolbar"><input id="q" placeholder="搜索公司、代码、行业"><select id="bucket"><option value="">全部行业</option></select><select id="grade"><option value="">全部主题纯度</option><option value="high">高纯度</option><option value="mid">中等</option><option value="low">偏弱</option></select></div><div id="content"></div></main><script src="next_round_evidence_cards_v1.js"></script><script>const DATA=NEXT_ROUND_EVIDENCE_CARDS_V1,rows=DATA.rows||[];const $=id=>document.getElementById(id);function esc(v){return String(v==null||v===''?'待补':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v){const n=Number(v);return isFinite(n)?n:null}function ce(r){return r.classification_evidence||{}}function ff(r){return r.financial_front||{}}function grade(r){const s=num(ce(r).theme_purity_score);return s>=88?'high':s>=75?'mid':'low'}function k(label,value){return `<div class="kpi"><b>${esc(value)}</b><span>${esc(label)}</span></div>`}function renderSummary(){const biz=rows.filter(r=>(r.business_evidence||{}).business_summary).length,fin=rows.filter(r=>ff(r).period).length,high=rows.filter(r=>grade(r)==='high').length,avg=Math.round(rows.reduce((a,r)=>a+(num(ce(r).theme_purity_score)||0),0)/Math.max(1,rows.length));$('summary').innerHTML=[['样本',rows.length],['主营/产品',biz],['财务字段',fin],['高纯度',high],['主题均分',avg],['数据错误',Object.keys(DATA.data_errors||{}).length]].map(x=>`<div class="metric"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('');$('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · 不生成深度报告，只做证据底座'}function init(){const buckets=[...new Set(rows.map(r=>r.bucket).filter(Boolean))].sort();}</script><script>function setup(){const buckets=[...new Set(rows.map(r=>r.bucket).filter(Boolean))].sort();$('bucket').innerHTML='<option value="">全部行业</option>'+buckets.map(b=>`<option>${esc(b)}</option>`).join('');['q','bucket','grade'].forEach(id=>$(id).addEventListener('input',render))}function filtered(){const q=$('q').value.trim().toLowerCase(),b=$('bucket').value,g=$('grade').value;return rows.filter(r=>{const text=[r.code,r.name,r.bucket,r.subcategory,r.reason].join(' ').toLowerCase();return(!q||text.includes(q))&&(!b||r.bucket===b)&&(!g||grade(r)===g)})}function card(r){const c=ce(r),f=ff(r),biz=r.business_evidence||{},products=(biz.product_names||biz.product_types||[]).slice(0,6),g=grade(r);return `<article class="card ${g}"><div class="name">${esc(r.name)} <span class="meta">${esc(r.code)}</span></div><div class="meta">${esc(r.bucket)} / ${esc(r.subcategory)} · ${esc(r.source)}</div><div class="kpis">${k('净利润(亿)',f.net_profit_attr_yi)}${k('净利同比',f.net_profit_yoy_pct)}${k('改善判断',f.improvement)}${k('主题纯度',c.theme_purity_score)}${k('基本面',c.fundamental_score)}${k('规则节点',r.rule_child_id||r.rule_root_id)}${k('合作对象','无已确认公开证据')}${k('市场强度','待接行情')}</div><div class="business">${esc(biz.business_summary||'待补主营业务证据')}</div><div class="pills">${products.length?products.map(x=>`<span class="pill good">${esc(x)}</span>`).join(''):'<span class="pill warn">产品关键词待补</span>'}${(r.warnings||[]).slice(0,3).map(x=>`<span class="pill warn">${esc(x)}</span>`).join('')}</div></article>`}function render(){const list=filtered();$('content').innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">没有匹配样本</div>'}renderSummary();setup();render();</script></body></html>
