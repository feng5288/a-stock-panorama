<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P0证据卡扩容预览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#0f1115;color:#e7e9ee}a{color:#86bdff;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:#0f1115;border-bottom:1px solid #2a2f3a}.top-inner{max-width:1500px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px}.meta{font-size:12px;color:#9aa4b2}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2d3542;background:#171c24;color:#d8dde6;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.btn.active{border-color:#6aa6ff;background:#10233c;color:#fff}.wrap{max-width:1500px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#171c24;border:1px solid #2a2f3a;border-radius:8px;padding:12px}.metric b{display:block;font-size:23px}.metric span{font-size:12px;color:#9aa4b2}.panel{background:#171c24;border:1px solid #2a2f3a;border-radius:8px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px}.card{border:1px solid #2a2f3a;border-left:4px solid #6aa6ff;background:#11161e;border-radius:8px;padding:14px}.card.high{border-left-color:#d95040}.card.mid{border-left-color:#d7a530}.card.low{border-left-color:#5f7f99}.name{font-weight:800;font-size:16px;margin-bottom:6px}.path{font-size:13px;color:#d7dce5;margin-bottom:10px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.kpi{background:#0f1115;border:1px solid #252b36;border-radius:8px;padding:8px;min-height:64px}.kpi b{display:block;font-size:15px;color:#fff;overflow-wrap:anywhere}.kpi span{display:block;font-size:11px;color:#9aa4b2;margin-top:4px}.section-title{font-size:12px;color:#9aa4b2;margin-top:10px;margin-bottom:5px}.business{font-size:13px;line-height:1.65;color:#d8dde6}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #2d3542;border-radius:999px;padding:3px 8px;font-size:12px;color:#d8dde6;background:#171c24}.pill.ok{border-color:#4fb06d;color:#8be5a2}.pill.warn{border-color:#d7a530;color:#f1d17a}.pill.todo{border-color:#6aa6ff;color:#a9ceff}.pill.hot{border-color:#d95040;color:#ffb1a8}.note{font-size:13px;color:#c6ccd6;line-height:1.7}.empty{padding:36px;text-align:center;color:#9aa4b2}@media(max-width:980px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

</head>
<body>
<header class="top"><div class="top-inner"><div><h1>P0证据卡扩容预览</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="v2_evidence_samples.html?v=sample2b">8家样本</a><a class="btn" href="p0_expansion_preview.html?v=clean1">P0原预览</a><a class="btn" href="index_classification_v2.html?v=power2">新版首页</a></div></div></header>
<main class="wrap"><div class="summary" id="summary"></div><section class="panel"><div class="note">这一页把 P0 的 80 家旧报告候选，批量升级为结构化证据卡。它不是最终报告，也不是逐只人工复核清单，而是用来观察：主营/产品、财务、主题纯度、基本面草分、合作对象缺口能否自动化覆盖。</div></section><section class="panel"><div class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="high_theme">主题纯度高</button><button class="btn" data-filter="biz_gap">主营/产品缺口</button><button class="btn" data-filter="fin_gap">财务缺口</button><button class="btn" data-filter="review">原P0待补证据</button><button class="btn" data-filter="partner_gap">合作对象待确认</button></div><div id="content"></div></section></main>
<script src="p0_evidence_cards_v1.js"></script>
<script>
var DATA=typeof P0_EVIDENCE_CARDS_V1!=="undefined"?P0_EVIDENCE_CARDS_V1:{rows:[]};
var rows=DATA.rows||[];var active='all';
function esc(v){return String(v==null||v===''?'待补':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=Number(v);return isFinite(n)?n:null}
function ce(r){return r.classification_evidence||{}}
function be(r){return r.business_evidence||{}}
function fin(r){return r.financial_front||{} }
function hasBiz(r){return !!(be(r).business_summary)}
function hasFin(r){return !!(fin(r).period)}
function cardClass(r){var s=num(ce(r).theme_purity_score);if(s>=88)return 'high';if(s>=75)return 'mid';return 'low'}
function filtered(){return rows.filter(function(r){if(active==='all')return true;if(active==='high_theme')return num(ce(r).theme_purity_score)>=88;if(active==='biz_gap')return !hasBiz(r);if(active==='fin_gap')return !hasFin(r);if(active==='review')return r.original_evidence_level==='review';if(active==='partner_gap')return (r.partner_evidence||{}).status==='无已确认公开证据';return true})}
function renderSummary(){var biz=rows.filter(hasBiz).length, finc=rows.filter(hasFin).length, high=rows.filter(function(r){return num(ce(r).theme_purity_score)>=88}).length, review=rows.filter(function(r){return r.original_evidence_level==='review'}).length;var avgTheme=Math.round(rows.reduce(function(a,r){return a+(num(ce(r).theme_purity_score)||0)},0)/Math.max(1,rows.length));var avgFund=Math.round(rows.reduce(function(a,r){return a+(num(ce(r).fundamental_score)||0)},0)/Math.max(1,rows.length));document.getElementById('summary').innerHTML=[["样本",rows.length],["主营/产品已补",biz],["财务已补",finc],["主题高纯度",high],["原待补证据",review],["主题均分",avgTheme],["基本面均分",avgFund]].map(function(x){return '<div class="metric"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>'}).join('');document.getElementById('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · P0 80家结构化证据卡'}
function kpi(label,value){return '<div class="kpi"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function card(r){var f=fin(r), c=ce(r), b=be(r), p=r.partner_evidence||{};var products=(b.product_names||b.product_types||[]).slice(0,7);var gaps=(c.remaining_gaps||[]).slice(0,6);return '<article class="card '+cardClass(r)+'"><div class="name">'+esc(r.name)+' <span class="meta">'+esc(r.code)+'</span></div><div class="path">'+esc(r.bucket)+' / '+esc(r.subcategory)+'</div><div class="kpis">'+kpi('归母净利润(亿)',f.net_profit_attr_yi)+kpi('净利同比',f.net_profit_yoy_pct)+kpi('改善判断',f.improvement)+kpi('主题纯度',c.theme_purity_score)+kpi('基本面草分',c.fundamental_score)+kpi('原证据等级',r.original_evidence_level)+kpi('市场强度','待接行情')+kpi('合作对象',p.status)+'</div><div class="section-title">主营业务证据</div><div class="business">'+esc(b.business_summary||'待从年报/公告/公司资料补充')+'</div><div class="section-title">产品/服务关键词</div><div class="pill-row">'+(products.length?products.map(function(x){return '<span class="pill ok">'+esc(x)+'</span>'}).join(''):'<span class="pill todo">待补</span>')+'</div><div class="section-title">证据状态</div><div class="business">'+esc(c.evidence_status)+'</div><div class="pill-row"><span class="pill todo">市场强度字段预留</span>'+gaps.map(function(g){return '<span class="pill warn">'+esc(g)+'</span>'}).join('')+'</div></article>'}
function render(){renderSummary();document.querySelectorAll('[data-filter]').forEach(function(b){b.classList.toggle('active',active===b.dataset.filter);b.onclick=function(){active=b.dataset.filter;render()}});var list=filtered();document.getElementById('content').innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">没有匹配样本</div>'}
render();
</script>
</body></html>
