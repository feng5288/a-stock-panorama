<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧报告1500接入预览</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;background:#0d1117;color:#c9d1d9}a{color:#79c0ff;text-decoration:none}.top{position:sticky;top:0;z-index:10;background:#0d1117;border-bottom:1px solid #21262d}.top-inner{max-width:1500px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;color:#f0f6fc}.meta{font-size:12px;color:#8b949e;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #30363d;background:#161b22;color:#8b949e;border-radius:7px;padding:7px 11px;font-size:12px;cursor:pointer}.btn.primary,.btn:hover{color:#58a6ff;border-color:#1f6feb55;background:#1f6feb18}.wrap{max-width:1500px;margin:0 auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px}.metric b{display:block;color:#f0f6fc;font-size:24px}.metric span{font-size:12px;color:#8b949e}.panel{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{height:34px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:7px;padding:0 9px}.toolbar input{flex:1;min-width:260px}.table-wrap{overflow:auto;border:1px solid #21262d;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{border-bottom:1px solid #21262d;padding:9px 10px;text-align:left;font-size:12px;vertical-align:top}th{position:sticky;top:0;background:#0d1117;color:#8b949e;font-weight:600}td{color:#c9d1d9}.code{font-family:Consolas,monospace;color:#8b949e}.pill{display:inline-flex;border:1px solid #30363d;background:#21262d;color:#8b949e;border-radius:999px;padding:2px 7px;font-size:11px;white-space:nowrap}.pill.v2{color:#7ee787;border-color:#23863655;background:#23863622}.pill.pending{color:#e3b341;border-color:#d2992255;background:#d2992220}.pill.missing{color:#ff9b9b;border-color:#f8514955;background:#f8514922}.muted{color:#8b949e;line-height:1.55}.preview{max-width:360px;color:#8b949e;line-height:1.45}.empty{padding:28px;text-align:center;color:#8b949e}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.small-list{display:flex;flex-direction:column;gap:7px}.small-item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #21262d;padding-bottom:7px;font-size:12px;color:#8b949e}.small-item b{color:#c9d1d9}@media(max-width:980px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}</style>
</head><body><header class="top"><div class="top-inner"><div><h1>旧报告1500接入预览</h1><div class="meta" id="subtitle"></div></div><div class="nav"><a class="btn" href="index_classification_v2_seed33.html?v=seedint1">243家分类树</a><a class="btn" href="classification_243_quality_diagnosis.html?v=q243a">243家诊断</a><a class="btn primary" href="legacy1500_preview.html?v=legacy1">旧报告接入</a></div></div></header><main class="wrap"><div id="summary" class="summary"></div><div class="grid"><section class="panel"><div class="toolbar"><input id="q" placeholder="搜索公司、代码、旧分类、新分类、摘要"><select id="status"><option value="">全部状态</option></select><select id="theme"><option value="">全部旧主分类</option></select></div><div class="table-wrap"><table><thead><tr><th>公司</th><th>接入状态</th><th>旧网站分类</th><th>V2分类</th><th>评级</th><th>报告</th><th>摘要</th></tr></thead><tbody id="rows"></tbody></table></div></section><aside><section class="panel"><h2 style="font-size:15px;margin-bottom:10px;color:#f0f6fc">旧主分类分布</h2><div id="themes" class="small-list"></div></section></aside></div></main><script src="legacy_reports_index_v1.js"></script><script>const DATA=LEGACY_REPORTS_INDEX_V1,rows=DATA.rows||[],$=id=>document.getElementById(id);function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pill(s){let c=s.includes('V2')?'v2':s.includes('代码')?'missing':'pending';return`<span class="pill ${c}">${esc(s)}</span>`}function renderSummary(){const s=DATA.summary||{};$('summary').innerHTML=[['旧报告公司',s.legacy_unique_count],['HTML报告',s.html_report_count],['已接V2证据',s.v2_evidence_ready_count],['待补V2证据',s.legacy_pending_v2_count],['待补代码',s.missing_code_count],['旧主分类',s.old_theme_count]].map(x=>`<div class="metric"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('');$('subtitle').textContent='生成时间 '+(DATA.generated_at||'--')+' · 旧报告保留原文，只接入索引和状态'}function setup(){const statuses=[...new Set(rows.map(r=>r.legacy_status).filter(Boolean))].sort();$('status').innerHTML='<option value="">全部状态</option>'+statuses.map(x=>`<option>${esc(x)}</option>`).join('');const themes=[...new Set(rows.map(r=>r.old_theme||'旧树未挂载'))].sort();$('theme').innerHTML='<option value="">全部旧主分类</option>'+themes.map(x=>`<option>${esc(x)}</option>`).join('');['q','status','theme'].forEach(id=>$(id).addEventListener('input',render))}function filtered(){const q=$('q').value.trim().toLowerCase(),st=$('status').value,th=$('theme').value;return rows.filter(r=>{const text=[r.code,r.name,r.old_theme,r.old_track,r.old_leaf,r.v2_primary,r.v2_leaf,r.summary,r.report_preview].join(' ').toLowerCase();return(!q||text.includes(q))&&(!st||r.legacy_status===st)&&(!th||(r.old_theme||'旧树未挂载')===th)})}function renderRows(){const list=filtered();$('rows').innerHTML=list.length?list.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="code">${esc(r.code)}${r.market?'.'+esc(r.market):''}</span></td><td>${pill(r.legacy_status)}</td><td>${esc(r.old_theme)}<br><span class="muted">${esc(r.old_track)} / ${esc(r.old_leaf)}</span></td><td>${esc(r.v2_primary)}<br><span class="muted">${esc(r.v2_leaf)} ${r.v2_weight?('W '+esc(r.v2_weight)):''}</span></td><td>${esc(r.rating)}<br><span class="muted">${esc(r.score)}</span></td><td>${r.has_html_report?`<a class="btn" href="${encodeURI(r.html_report_path)}" target="_blank">打开旧报告</a>`:'<span class="muted">缺HTML</span>'}</td><td><div class="preview">${esc(r.summary&&r.summary!=='暂无分析摘要'?r.summary:r.report_preview)}</div></td></tr>`).join(''):`<tr><td colspan="7" class="empty">没有匹配项</td></tr>`}function renderThemes(){const items=Object.entries(DATA.old_theme_counts||{}).slice(0,24);$('themes').innerHTML=items.map(([k,v])=>`<div class="small-item"><b>${esc(k)}</b><span>${esc(v)}家</span></div>`).join('')}function render(){renderRows();renderThemes()}renderSummary();setup();render();</script></body></html>
