let q='',pri='',iss='';
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function metric(k,v){return `<div class="metric"><b>${esc(v)}</b><span>${esc(k)}</span></div>`}
function pill(t,cls){return `<span class="pill ${cls||'info'}">${esc(t)}</span>`}
function rows(){return QUEUE_DATA.rows.filter(r=>{if(pri&&r.priority!==pri)return false;if(iss&&!(r.issue_types||[]).includes(iss))return false;let blob=[r.code,r.name,r.old_path,r.mapped_node_name,r.recommended_action].join(' ').toLowerCase();return !q||blob.includes(q.toLowerCase())}).slice(0,500)}
function render(){let s=QUEUE_DATA.summary||{};document.getElementById('subtitle').textContent=`生成时间 ${QUEUE_DATA.generated_at} · 显示前500条匹配结果`;document.getElementById('summary').innerHTML=[['旧报告',s.legacy_total],['待V2',s.legacy_pending_v2_count],['已映射',s.mapped_legacy_only],['P0',s.priority_counts?.P0||0],['P1',s.priority_counts?.P1||0],['P2',s.priority_counts?.P2||0]].map(x=>metric(x[0],x[1])).join('');document.getElementById('rows').innerHTML=rows().map(r=>`<tr><td>${pill(r.priority,r.priority==='P0'?'danger':(r.priority==='P1'?'warn':'info'))}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.old_path)}</td><td>${esc(r.mapped_node_name)}</td><td>${(r.issue_types||[]).slice(0,3).map(x=>pill(x,'warn')).join('')}</td><td>${esc(r.recommended_action)}</td><td>${r.html_report_path?`<a href="${encodeURI(r.html_report_path)}">打开</a>`:'无'}</td></tr>`).join('')}
document.getElementById('search').oninput=e=>{q=e.target.value;render()};document.getElementById('priority').onchange=e=>{pri=e.target.value;render()};document.getElementById('issue').onchange=e=>{iss=e.target.value;render()};render();</script></body></html>
