<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页1-9号证据补齐队列</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#f5f6f8;color:#1f2732}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #dbe1ea}.top-inner{max-width:1500px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px}.sub{font-size:12px;color:#697586;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 11px;font-size:12px;cursor:pointer}.btn.active,.btn:hover{background:#1e3a5f;color:#fff;border-color:#1e3a5f}.wrap{max-width:1500px;margin:0 auto;padding:18px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:14px}.panel{background:#fff;border:1px solid #dbe1ea;border-radius:8px;padding:15px}.note{font-size:14px;line-height:1.75;color:#334155}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{background:#f1f5f9;border:1px solid #dbe1ea;border-radius:8px;padding:12px}.metric b{display:block;font-size:25px}.metric span{font-size:12px;color:#697586}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{height:36px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px}.toolbar input{flex:1;min-width:260px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(470px,1fr));gap:12px}.card{background:#fff;border:1px solid #dbe1ea;border-left:5px solid #64748b;border-radius:8px;padding:14px}.card.external{border-left-color:#2563eb}.card.gap{border-left-color:#d97706}.card.old{border-left-color:#64748b}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:17px;font-weight:850}.small{font-size:12px;color:#64748b}.pill{display:inline-flex;border:1px solid #d0d8e4;background:#f8fafc;border-radius:999px;padding:3px 8px;font-size:12px;color:#475569;margin:6px 5px 0 0}.blue{border-color:#8ab4ff;background:#eef5ff;color:#1e4e9a}.yellow{border-color:#f0c365;background:#fff8e6;color:#855c0b}.gray{border-color:#cbd5e1;background:#f1f5f9;color:#475569}.green{border-color:#86d3a7;background:#effdf5;color:#166534}.red{border-color:#f3a19b;background:#fff1f0;color:#9f2f24}.section{margin-top:10px}.section-title{font-size:12px;color:#64748b;margin-bottom:4px}.text{font-size:13px;line-height:1.65;color:#334155}.needs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}.needs div{border:1px dashed #cbd5e1;border-radius:7px;padding:8px;font-size:13px;background:#f8fafc}.empty{text-align:center;color:#697586;padding:28px}@media(max-width:900px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.needs{grid-template-columns:1fr}}
</style>
</head><body>
<header class="top"><div class="top-inner"><div><h1>首页1-9号证据补齐队列</h1><div class="sub" id="sub"></div></div><div class="nav"><a class="btn" href="core9_concept_pool_workbench.html?v=local2">公司池校准</a><a class="btn" href="index_v2_delivery.html?v=local2">当前首页</a></div></div></header>
<main class="wrap"><section class="hero"><div class="panel"><div class="note"><b>处理原则：</b>外部补充候选先补证据，确认后才纳入首页核心概念；当前池证据不足先补主营/财报/公告证据，再决定是否进入完整 V2 第一批；旧路径待确认暂缓，不直接写完整 V2。</div></div><div class="panel"><div class="metrics" id="metrics"></div></div></section>
<section class="panel"><div class="toolbar"><button class="btn active" data-b="">全部</button><button class="btn" data-b="外部补充候选">外部补充</button><button class="btn" data-b="当前池证据不足">证据不足</button><button class="btn" data-b="旧路径待确认">旧路径</button><select id="concept"><option value="">全部概念</option></select><input id="q" placeholder="搜索公司 / 代码 / 概念 / 关键词"></div><div id="content"></div></section></main>
<script src="core9_evidence_queue_v1.js"></script>
<script>
const DATA=CORE9_EVIDENCE_QUEUE_V1;let bucket='';let concept='';let q='';const $=id=>document.getElementById(id);
function esc(v){return String(v==null||v===''?'无':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cardClass(b){return b==='外部补充候选'?'external':b==='当前池证据不足'?'gap':'old'}
function pillClass(b){return b==='外部补充候选'?'blue':b==='当前池证据不足'?'yellow':'gray'}
function pill(t,c){return `<span class="pill ${c||''}">${esc(t)}</span>`}
function renderMetrics(){const s=DATA.summary;$('sub').textContent=`生成时间 ${DATA.generated_at} · 本地队列 ${s.total} 家`;$('metrics').innerHTML=[['总队列',s.total],['外部补充',s.external],['证据不足',s.evidence_gap],['旧路径',s.old_path]].map(x=>`<div class="metric"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('')}
function setup(){const concepts=[...new Set(DATA.rows.map(r=>r.concept_name))];$('concept').innerHTML='<option value="">全部概念</option>'+concepts.map(c=>`<option>${esc(c)}</option>`).join('')}
function rows(){const term=q.trim().toLowerCase();return DATA.rows.filter(r=>!bucket||r.bucket===bucket).filter(r=>!concept||r.concept_name===concept).filter(r=>!term||[r.code,r.name,r.concept_name,r.bucket,r.current_primary,(r.keyword_hits||[]).join(' ')].join(' ').toLowerCase().includes(term))}
function card(r,i){return `<article class="card ${cardClass(r.bucket)}"><div class="head"><div><div class="name">#${i+1} ${esc(r.name)} <span class="small">${esc(r.code)}</span></div><div class="small">${esc(r.concept_seq)}. ${esc(r.concept_name)} · ${esc(r.current_primary)}</div></div><div>${pill(r.bucket,pillClass(r.bucket))}</div></div><div>${pill(r.priority,r.priority==='P0'?'red':r.priority==='P1'?'yellow':'gray')}${pill(r.processing_status,'green')}${(r.keyword_hits||[]).map(x=>pill(x)).join('')}</div><div class="section"><div class="section-title">建议动作</div><div class="text">${esc(r.queue_action)}</div></div><div class="section"><div class="section-title">需要补齐的证据</div><div class="needs">${(r.evidence_needs||[]).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><div class="section"><div class="section-title">当前线索</div><div class="text">${esc((r.snippets||[]).join(' / ')||'无')}</div></div>${r.report_path?`<div class="section"><a class="btn" href="${encodeURI(r.report_path)}">打开底稿/报告</a></div>`:''}</article>`}
function render(){const list=rows();$('content').innerHTML=list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">没有匹配结果</div>'}
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{bucket=b.dataset.b;document.querySelectorAll('[data-b]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});$('concept').oninput=e=>{concept=e.target.value;render()};$('q').oninput=e=>{q=e.target.value;render()};renderMetrics();setup();render();
</script></body></html>
